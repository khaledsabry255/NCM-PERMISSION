<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCM Permission Search</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1117">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NCM Permits">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>

/* ============ CONFIG =============
   استبدل اللينكات دي بلينكات الـ CSV بتاعتك بعد ما تعمل:
   Google Sheet > File > Share > Publish to web > اختار التاب المطلوب > CSV
================================== */

:root{
  --bg-deep:#0B1117;
  --bg-mid:#0e1620;
  --glass:rgba(255,255,255,0.06);
  --glass-border:rgba(255,255,255,0.14);
  --gold:#17e0c3;
  --gold-soft:#5ef2dc;
  --gold-dim:#0c8a78;
  --text-main:#f4f1e9;
  --text-dim:#9fb3ae;
  --ok:#3ecf8e;
  --ok-bg:rgba(62,207,142,0.14);
  --soon:#f0c14b;
  --soon-bg:rgba(240,193,75,0.16);
  --bad:#ef6a6a;
  --bad-bg:rgba(239,106,106,0.16);
  --ban:#ff3b3b;
  --unclear:#a8b5b2;
  --unclear-bg:rgba(168,181,178,0.14);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  font-family:'IBM Plex Sans Arabic','Tajawal',sans-serif;
  color:var(--text-main);
  background:var(--bg-deep);
}

.wrap{
  position:relative; z-index:1;
  max-width:640px;
  margin:0 auto;
  padding:0 16px 60px;
}

/* ---- Compact header bar ---- */
.app-header{
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px 16px;
  margin:0 -16px 18px;
  background:rgba(11,17,23,0.92);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.app-header .brand{
  display:flex;
  align-items:center;
  gap:9px;
}
.app-header .brand svg{ width:26px; height:26px; flex-shrink:0; }
.app-header .brand-text{
  font-family:'Tajawal',sans-serif;
  font-weight:800;
  font-size:14.5px;
  color:var(--text-main);
  letter-spacing:.2px;
  white-space:nowrap;
}
.system-status{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  color:var(--text-dim);
  font-weight:600;
  white-space:nowrap;
}
.status-dot{
  width:7px; height:7px;
  border-radius:50%;
  background:var(--ok);
  box-shadow:0 0 0 0 rgba(62,207,142,0.5);
  animation:statusPulse 2.2s infinite;
  flex-shrink:0;
}
.status-dot.updating{ background:var(--soon); animation:statusPulse2 1.1s infinite; }
.status-dot.error{ background:var(--bad); animation:none; }
@keyframes statusPulse{
  0%{box-shadow:0 0 0 0 rgba(62,207,142,.45);}
  70%{box-shadow:0 0 0 6px rgba(62,207,142,0);}
  100%{box-shadow:0 0 0 0 rgba(62,207,142,0);}
}
@keyframes statusPulse2{
  0%{opacity:1;} 50%{opacity:.35;} 100%{opacity:1;}
}

/* ---- Tabs (segmented control) ---- */
.tabs{
  display:flex;
  gap:4px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;
  padding:4px;
  margin-bottom:16px;
}
.tab-btn{
  flex:1;
  border:none;
  border-radius:9px;
  padding:10px 10px;
  background:transparent;
  color:var(--text-dim);
  font-family:inherit;
  font-size:13.5px;
  font-weight:700;
  cursor:pointer;
  transition:all .15s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}
.tab-btn:hover{ color:var(--text-main); }
.tab-btn.active{
  background:var(--gold);
  color:#06120f;
  box-shadow:0 4px 14px rgba(23,224,195,0.22);
}

/* ---- Search area ---- */
.search-card{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
  padding:14px;
}
.search-row{
  display:flex;
  gap:8px;
}
.search-input-wrap{
  position:relative;
  flex:1;
}
.search-input-wrap svg{
  position:absolute;
  top:50%; right:14px;
  transform:translateY(-50%);
  color:var(--text-dim);
  pointer-events:none;
}
.search-row input{
  width:100%;
  padding:14px 42px 14px 16px;
  border-radius:10px;
  border:1px solid var(--glass-border);
  background:rgba(0,0,0,0.22);
  color:var(--text-main);
  font-family:inherit;
  font-size:15.5px;
  outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.search-row input::placeholder{color:var(--text-dim);}
.search-row input:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(23,224,195,0.12);}
.search-row button{
  padding:0 22px;
  border-radius:10px;
  border:none;
  background:var(--gold);
  color:#06120f;
  font-family:inherit;
  font-weight:800;
  font-size:14.5px;
  cursor:pointer;
  transition:filter .15s ease, transform .15s ease;
}
.search-row button:hover{ filter:brightness(1.06); }
.search-row button:active{transform:translateY(1px);}

.status-line{
  text-align:center;
  color:var(--text-dim);
  font-size:12.5px;
  margin-top:10px;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.status-line:empty{ margin-top:0; }
.spinner{
  width:13px; height:13px;
  border-radius:50%;
  border:2px solid rgba(23,224,195,0.25);
  border-top-color:var(--gold);
  animation:spin .7s linear infinite;
  flex-shrink:0;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---- Pre-search / empty / error states ---- */
.search-hint, .empty-state, .error-state{
  text-align:center;
  color:var(--text-dim);
  padding:44px 20px;
  font-size:13.5px;
}
.search-hint svg, .empty-state svg, .error-state svg{
  display:block;
  margin:0 auto 12px;
  color:rgba(159,179,174,0.5);
}
.empty-state b{color:var(--text-main);}
.error-state{ color:var(--bad); }
.error-state svg{ color:var(--bad); opacity:.7; }

.results{
  margin-top:16px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* ---- Personnel Record card ---- */
.person-card{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.09);
  border-radius:16px;
  overflow:hidden;
  animation:recordIn .25s ease;
}
@keyframes recordIn{
  from{ opacity:0; transform:translateY(6px); }
  to{ opacity:1; transform:translateY(0); }
}
.person-head{
  padding:14px 18px 0;
}
.record-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}
.record-identity{ min-width:0; padding-bottom:14px; border-bottom:1px solid rgba(255,255,255,0.08); }
.record-name{
  font-family:'Tajawal',sans-serif;
  font-weight:800;
  font-size:21px;
  color:var(--text-main);
  line-height:1.3;
  text-align:center;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  padding:14px 10px;
  margin-bottom:10px;
}
.record-subid{
  text-align:center;
  font-weight:700;
  font-size:15.5px;
  letter-spacing:.5px;
  color:var(--gold-soft);
  background:rgba(23,224,195,0.06);
  border:1px solid rgba(23,224,195,0.22);
  border-radius:12px;
  padding:11px 10px;
}
.record-subid.subid-plain{
  color:var(--text-dim);
  background:rgba(255,255,255,0.04);
  border-color:rgba(255,255,255,0.1);
  font-size:13px;
  font-weight:600;
  letter-spacing:0;
}
.count-badge{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.12);
  color:var(--text-dim);
  font-size:11px;
  font-weight:700;
  padding:5px 10px;
  border-radius:100px;
  white-space:nowrap;
  flex-shrink:0;
}

.occ-selector{
  display:flex;
  gap:6px;
  overflow-x:auto;
}
.occ-chip{
  flex-shrink:0;
  min-width:32px;
  height:32px;
  padding:0 10px;
  border-radius:8px;
  border:1px solid var(--glass-border);
  background:rgba(255,255,255,0.03);
  color:var(--text-dim);
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  transition:all .15s ease;
}
.occ-chip:hover{ border-color:rgba(23,224,195,0.35); color:var(--text-main); }
.occ-chip.active{
  background:rgba(23,224,195,0.14);
  border-color:var(--gold);
  color:var(--gold-soft);
}

.occ-content{ padding:14px 18px 18px; }

.occ-label{
  font-size:12px;
  font-weight:600;
  color:var(--text-dim);
  margin-bottom:10px;
}

/* Record rows: clean divided list, not boxes */
.record-rows{
  display:flex;
  flex-direction:column;
  border:1px solid rgba(255,255,255,0.07);
  border-radius:10px;
  overflow:hidden;
  margin-bottom:14px;
}
.record-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:10px 14px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  font-size:13.5px;
}
.record-row:last-child{ border-bottom:none; }
.record-row .k{
  color:var(--text-dim);
  font-weight:600;
  font-size:12px;
  white-space:nowrap;
  flex-shrink:0;
}
.record-row .v{
  color:var(--text-main);
  font-weight:600;
  text-align:left;
  flex:1;
}

/* Permit status: distinctive banner (icon + label on one side, value on the other) */
.permit-banner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:14px 16px;
  border-radius:12px;
  border:1.5px solid transparent;
  margin-bottom:14px;
}
.permit-banner .pb-left{
  display:flex;
  align-items:center;
  gap:10px;
}
.permit-icon{
  width:34px; height:34px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.permit-banner .pb-tag{
  font-size:11px;
  font-weight:700;
}
.permit-banner .pb-value{
  font-size:16px;
  font-weight:800;
}
.pb-ok{ background:var(--ok-bg); border-color:rgba(62,207,142,0.4); box-shadow:0 4px 16px rgba(62,207,142,0.1); color:var(--ok); }
.pb-ok .permit-icon{ background:rgba(62,207,142,0.2); }
.pb-soon{ background:var(--soon-bg); border-color:rgba(240,193,75,0.4); box-shadow:0 4px 16px rgba(240,193,75,0.1); color:var(--soon); }
.pb-soon .permit-icon{ background:rgba(240,193,75,0.2); }
.pb-bad{ background:var(--bad-bg); border-color:rgba(239,106,106,0.4); box-shadow:0 4px 16px rgba(239,106,106,0.1); color:var(--bad); }
.pb-bad .permit-icon{ background:rgba(239,106,106,0.2); }
.pb-ban{ background:var(--ban); border-color:var(--ban); box-shadow:0 4px 16px rgba(255,59,59,0.2); color:#fff; }
.pb-ban .permit-icon{ background:rgba(255,255,255,0.22); }
.pb-unclear{ background:var(--unclear-bg); border-color:rgba(168,181,178,0.4); box-shadow:0 4px 16px rgba(168,181,178,0.08); color:var(--unclear); }
.pb-unclear .permit-icon{ background:rgba(168,181,178,0.2); }

.occ-date-box{
  text-align:center;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  padding:12px 10px;
  margin-bottom:14px;
}
.occ-date-box .odb-label{
  font-weight:700;
  font-size:14px;
  color:var(--text-main);
}
.occ-date-box .odb-value{
  font-size:12.5px;
  color:var(--text-dim);
  margin-top:4px;
}

footer{
  text-align:center;
  color:var(--text-dim);
  font-size:11.5px;
  margin-top:40px;
  opacity:.6;
}

@media (max-width:480px){
  .search-row{ flex-direction:column; }
  .search-row button{ padding:13px; }
  .record-name{ font-size:19px; }
}
/* ======================= Lock Screen ======================= */

#app-root{ display:none; }
body.unlocked #app-root{ display:block; }
body.unlocked #lock-screen{ display:none; }

#lock-screen{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
  padding:24px;
}
.lock-ring-bg{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:340px; height:340px;
  border-radius:50%;
  border:1px solid rgba(23,224,195,0.10);
  pointer-events:none;
}
.lock-ring-bg::before{
  content:"";
  position:absolute; inset:34px;
  border-radius:50%;
  border:1px solid rgba(23,224,195,0.07);
}

.lock-card{
  position:relative;
  z-index:1;
  width:100%;
  max-width:340px;
  text-align:center;
}
.lock-logo{
  display:flex;
  justify-content:center;
  margin-bottom:14px;
  filter:drop-shadow(0 6px 18px rgba(23,224,195,0.18));
}
.lock-card h1{
  font-family:'Tajawal',sans-serif;
  font-weight:900;
  font-size:24px;
  color:var(--text-main);
  margin:0 0 6px;
}
.lock-kicker{
  font-size:11px;
  letter-spacing:4px;
  color:var(--gold-soft);
  font-weight:700;
  margin-bottom:36px;
}

.pin-label{
  font-size:13px;
  color:var(--text-dim);
  margin-bottom:16px;
}
.pin-dots{
  display:flex;
  justify-content:center;
  gap:16px;
  margin-bottom:10px;
}
.pin-dot{
  width:14px;
  height:14px;
  border-radius:50%;
  border:1.5px solid rgba(23,224,195,0.4);
  background:transparent;
  transition:background .15s ease, transform .15s ease, border-color .15s ease;
}
.pin-dot.filled{
  background:var(--gold);
  border-color:var(--gold);
  transform:scale(1.1);
}
.pin-dots.shake{
  animation:pinShake .4s ease;
}
.pin-dots.shake .pin-dot{
  border-color:var(--bad);
}
@keyframes pinShake{
  10%,90% { transform:translateX(-1px); }
  20%,80% { transform:translateX(2px); }
  30%,50%,70% { transform:translateX(-5px); }
  40%,60% { transform:translateX(5px); }
}

.pin-error{
  height:16px;
  font-size:12.5px;
  color:var(--bad);
  margin-bottom:14px;
  opacity:0;
  transition:opacity .15s ease;
}
.pin-error.show{ opacity:1; }

.pin-hidden-input{
  position:absolute;
  opacity:0;
  pointer-events:none;
  width:1px;
  height:1px;
}

.pin-pad{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:12px;
  max-width:280px;
  margin:0 auto;
}
.pin-key{
  aspect-ratio:1;
  border-radius:16px;
  border:1px solid var(--glass-border);
  background:var(--glass);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:var(--text-main);
  font-family:'Tajawal',sans-serif;
  font-size:20px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all .12s ease;
}
.pin-key:hover{ border-color:rgba(23,224,195,0.4); }
.pin-key:active{ transform:scale(0.94); background:rgba(23,224,195,0.12); }
.pin-key-action{ color:var(--gold-soft); }

@media (max-width:380px){
  .pin-pad{ max-width:240px; gap:10px; }
  .lock-card h1{ font-size:21px; }
}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-ring-bg"></div>
  <div class="lock-card">
    <div class="lock-logo">
      <svg width="72" height="72" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M20 20 L26 10 L74 10 L80 20 L80 44 Q80 68 50 90 Q20 68 20 44 Z"
              fill="none" stroke="var(--gold)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
        <g transform="translate(50 44)">
          <circle r="15.5" fill="none" stroke="var(--gold)" stroke-width="3.8" stroke-dasharray="75 15" stroke-dashoffset="-5" transform="rotate(-90)"/>
          <circle r="12.4" fill="none" stroke="var(--gold-dim)" stroke-width="2.4" stroke-dasharray="20 50" stroke-dashoffset="-45" transform="rotate(-90)"/>
          <circle r="2.6" fill="var(--gold)"/>
        </g>
      </svg>
    </div>
    <h1>بحث التصاريح</h1>
    <div class="lock-kicker">SECURE ACCESS</div>

    <div class="pin-label">أدخل رمز الدخول</div>
    <div class="pin-dots" id="pin-dots">
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
    </div>
    <div class="pin-error" id="pin-error">رمز الدخول غير صحيح</div>

    <input id="pin-hidden-input" type="tel" inputmode="numeric" autocomplete="off" maxlength="4" class="pin-hidden-input" aria-label="رمز الدخول">

    <div class="pin-pad">
      <button type="button" class="pin-key" data-digit="1">1</button>
      <button type="button" class="pin-key" data-digit="2">2</button>
      <button type="button" class="pin-key" data-digit="3">3</button>
      <button type="button" class="pin-key" data-digit="4">4</button>
      <button type="button" class="pin-key" data-digit="5">5</button>
      <button type="button" class="pin-key" data-digit="6">6</button>
      <button type="button" class="pin-key" data-digit="7">7</button>
      <button type="button" class="pin-key" data-digit="8">8</button>
      <button type="button" class="pin-key" data-digit="9">9</button>
      <button type="button" class="pin-key pin-key-action" id="pin-backspace" aria-label="مسح">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 4H8l-6 8 6 8h13a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1z"/><path d="M15 10l-4 4M11 10l4 4"/></svg>
      </button>
      <button type="button" class="pin-key" data-digit="0">0</button>
      <button type="button" class="pin-key pin-key-action" id="pin-submit" aria-label="دخول">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
      </button>
    </div>
  </div>
</div>


<div id="app-root">
<div class="wrap">
  <div class="app-header">
    <div class="brand">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path d="M20 20 L26 10 L74 10 L80 20 L80 44 Q80 68 50 90 Q20 68 20 44 Z"
              fill="none" stroke="var(--gold)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
        <g transform="translate(50 44)">
          <circle r="15.5" fill="none" stroke="var(--gold)" stroke-width="5.5" stroke-dasharray="75 15" stroke-dashoffset="-5" transform="rotate(-90)"/>
          <circle r="2.6" fill="var(--gold)"/>
        </g>
      </svg>
      <span class="brand-text">NCM Permission Search</span>
    </div>
    <div class="system-status">
      <span class="status-dot updating" id="system-status-dot"></span>
      <span id="system-status-label">جاري التحديث</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="individuals">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      الأفراد

<script>
/* ======================= Lock Screen (UI access lock, client-side only) ======================= */
(function(){
  const CORRECT_PIN = "1804";
  const UNLOCK_FLAG_KEY = "ncm_device_unlocked"; // stores only a yes/no flag, never the PIN itself
  let entered = "";

  // Already unlocked once on this device before -> skip the lock screen entirely.
  if(localStorage.getItem(UNLOCK_FLAG_KEY) === "1"){
    document.body.classList.add("unlocked");
    return;
  }

  const dotsWrap = document.getElementById("pin-dots");
  const dots = dotsWrap.querySelectorAll(".pin-dot");
  const errorEl = document.getElementById("pin-error");
  const hiddenInput = document.getElementById("pin-hidden-input");

  function renderDots(){
    dots.forEach((d,i)=> d.classList.toggle("filled", i < entered.length));
  }

  function clearError(){
    errorEl.classList.remove("show");
    dotsWrap.classList.remove("shake");
  }

  function showError(){
    errorEl.classList.add("show");
    dotsWrap.classList.add("shake");
    setTimeout(()=>{
      entered = "";
      hiddenInput.value = "";
      renderDots();
      dotsWrap.classList.remove("shake");
    }, 420);
  }

  function unlock(){
    try{ localStorage.setItem(UNLOCK_FLAG_KEY, "1"); }catch(e){}
    document.body.classList.add("unlocked");
  }

  function checkIfComplete(){
    if(entered.length === 4){
      if(entered === CORRECT_PIN){
        clearError();
        unlock();
      }else{
        showError();
      }
    }
  }

  function addDigit(d){
    if(entered.length >= 4) return;
    clearError();
    entered += d;
    hiddenInput.value = entered;
    renderDots();
    checkIfComplete();
  }

  function removeDigit(){
    entered = entered.slice(0, -1);
    hiddenInput.value = entered;
    clearError();
    renderDots();
  }

  document.querySelectorAll(".pin-key[data-digit]").forEach(btn=>{
    btn.addEventListener("click", ()=> addDigit(btn.dataset.digit));
  });
  document.getElementById("pin-backspace").addEventListener("click", removeDigit);
  document.getElementById("pin-submit").addEventListener("click", checkIfComplete);

  hiddenInput.addEventListener("input", ()=>{
    entered = hiddenInput.value.replace(/[^0-9]/g,"").slice(0,4);
    hiddenInput.value = entered;
    clearError();
    renderDots();
    checkIfComplete();
  });

  document.addEventListener("keydown", (e)=>{
    if(document.body.classList.contains("unlocked")) return;
    if(e.key >= "0" && e.key <= "9") addDigit(e.key);
    else if(e.key === "Backspace") removeDigit();
    else if(e.key === "Enter") checkIfComplete();
  });

  // Tapping anywhere on the card focuses the hidden input so the device's own numeric keyboard can be used too.
  document.querySelector(".lock-card").addEventListener("click", ()=> hiddenInput.focus());
  hiddenInput.focus();
})();
</script>

<script>
/* ======================= CONFIG ======================= */
// حط هنا لينكات الـ CSV اللي هتاخدها من: Google Sheet > Share > Publish to web > اختار التاب > CSV
const INDIVIDUALS_CSV_URL = "https://docs.google.com/spreadsheets/d/18EH8aogUF0qZeLFjku7uiF3e9a_TjCTojRd53qMx0a0/gviz/tq?tqx=out:csv&gid=1465451083";
const VEHICLES_CSV_URL    = "https://docs.google.com/spreadsheets/d/18EH8aogUF0qZeLFjku7uiF3e9a_TjCTojRd53qMx0a0/gviz/tq?tqx=out:csv&gid=383739446";

/* ======================= Helpers ======================= */

function normalize(s){
  if(s===null || s===undefined) return "";
  return String(s).replace(/\s+/g," ").trim();
}

function digitsOnly(s){
  return normalize(s).replace(/[^\d]/g,"");
}

const ORDINALS = ["الأولى","الثانية","الثالثة","الرابعة","الخامسة","السادسة","السابعة","الثامنة","التاسعة","العاشرة"];
function occurrenceLabel(i){
  // i is 0-indexed
  if(i < ORDINALS.length) return "المرة " + ORDINALS[i];
  return "المرة رقم " + (i+1);
}

const BAN_WORDS = ["منع"];
const RENEW_WORDS = ["عايز تجديد","الرخصه منتهيه","غيرت لوحات","تجديد"];
const TEMP_WORDS = ["مؤقت"];
const QUESTION_MARKS_ONLY = /^[؟?]+$/;

function parseDateLoose(v){
  if(!v) return null;
  const s = normalize(v);
  const m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  if(!m) return null;
  const day = parseInt(m[1],10), month = parseInt(m[2],10), year = parseInt(m[3],10);
  const d = new Date(year, month-1, day);
  if(isNaN(d.getTime())) return null;
  return d;
}

function classifyPermit(rawValue){
  // 1) Strictly empty (null/undefined/whitespace-only) -> awaiting response
  const s = normalize(rawValue);
  if(s === ""){
    return {text:"في انتظار الرد", cls:"pb-soon"};
  }

  // 2) Made up of one or more question marks only (spaces ignored) -> status undetermined
  const noSpaces = s.replace(/\s+/g,"");
  if(QUESTION_MARKS_ONLY.test(noSpaces)){
    return {text:"غير محدد موقفه حتى الآن", cls:"pb-unclear"};
  }

  // 3) Everything else keeps the existing classification, shown as-is
  if(BAN_WORDS.some(w=>s.includes(w))) return {text:s, cls:"pb-ban"};
  if(RENEW_WORDS.some(w=>s.includes(w))) return {text:s, cls:"pb-bad"};
  if(TEMP_WORDS.some(w=>s.includes(w))) return {text:s, cls:"pb-unclear"};

  const d = parseDateLoose(s);
  if(d){
    const today = new Date();
    today.setHours(0,0,0,0);
    const diffDays = Math.round((d - today) / 86400000);
    if(diffDays < 0) return {text:s, cls:"pb-bad"};
    if(diffDays <= 30) return {text:s, cls:"pb-soon"};
    return {text:s, cls:"pb-ok"};
  }
  return {text:s, cls:"pb-unclear"};
}

function isSeparatorRow(row, keyField){
  // separator/blank rows have no meaningful key value
  return !normalize(row[keyField]);
}

function loadCSV(url){
  return new Promise((resolve, reject)=>{
    Papa.parse(url, {
      download:true,
      header:true,
      skipEmptyLines:false,
      complete: (res)=> resolve(res.data),
      error: (err)=> reject(err)
    });
  });
}

function findHeaderKey(sampleRow, target){
  return Object.keys(sampleRow).find(k => normalize(k) === target);
}

function loadCSVRaw(url){
  return new Promise((resolve, reject)=>{
    Papa.parse(url, {
      download:true,
      header:false,
      skipEmptyLines:false,
      complete: (res)=> resolve(res.data),
      error: (err)=> reject(err)
    });
  });
}

/* ======================= Individuals ======================= */

let individualsGroups = null; // Map key -> {name, nationalId, records:[...]}

// Fixed column order in "تصاريح أفراد": م, م, الاسم, الوظيفة, الرقم القومى, العنوان, ملاحظات, المرسل, تصريح, Mali Day
const IND_COL = { NAME:2, JOB:3, ID:4, ADDR:5, NOTE:6, SENDER:7, PERMIT:8, DAY:9 };

async function initIndividuals(){
  const statusEl = document.getElementById("ind-status");
  if(INDIVIDUALS_CSV_URL.startsWith("PUT_")){
    statusEl.textContent = "لسه محتاج تحط لينك الـ CSV الخاص بشيت الأفراد فوق في الكود (INDIVIDUALS_CSV_URL).";
    return;
  }
  try{
    const rows = await loadCSVRaw(INDIVIDUALS_CSV_URL);
    const dataRows = rows.slice(1); // skip header row

    individualsGroups = new Map();

    dataRows.forEach(cols=>{
      if(!cols || cols.length < 5) return;
      const idVal = normalize(cols[IND_COL.ID]);
      const nameVal = normalize(cols[IND_COL.NAME]);
      if(!idVal && !nameVal) return; // separator / empty row

      const key = idVal ? ("ID:"+digitsOnly(idVal)) : ("NAME:"+nameVal);
      if(!individualsGroups.has(key)){
        individualsGroups.set(key, { name:nameVal, nationalId:idVal, records:[] });
      }
      const g = individualsGroups.get(key);
      g.records.push({
        name:nameVal, nationalId:idVal,
        job: normalize(cols[IND_COL.JOB]),
        address: normalize(cols[IND_COL.ADDR]),
        note: normalize(cols[IND_COL.NOTE]),
        sender: normalize(cols[IND_COL.SENDER]),
        permit: cols[IND_COL.PERMIT],
        day: cols[IND_COL.DAY],
        dayParsed: parseDateLoose(cols[IND_COL.DAY])
      });
    });

    window.__individualsByName = new Map();
    individualsGroups.forEach((g)=>{
      const nameKey = normalize(g.name);
      if(!nameKey) return;
      if(!window.__individualsByName.has(nameKey)) window.__individualsByName.set(nameKey, []);
      window.__individualsByName.get(nameKey).push(g);
    });

    statusEl.textContent = "";
    return true;
  }catch(err){
    const detail = (err && (err.message || err.toString())) || "غير معروف";
    statusEl.textContent = `حصل خطأ في تحميل بيانات الأفراد (${detail}). لو بتجرب الملف من على جهازك مباشرة (file://) ده السبب الأشهر — لازم يتفتح من على سيرفر (GitHub Pages) عشان يقدر يجيب البيانات من جوجل.`;
    console.error(err);
    return false;
  }
}

const PERMIT_ICONS = {
  "pb-ok": '<path d="M20 6L9 17l-5-5"/>',
  "pb-soon": '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  "pb-bad": '<circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><circle cx="12" cy="16" r="0.5" fill="currentColor"/>',
  "pb-ban": '<circle cx="12" cy="12" r="9"/><path d="M5.5 5.5l13 13"/>',
  "pb-unclear": '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.7v.3"/><circle cx="12" cy="16.5" r="0.5" fill="currentColor"/>'
};

function attachOccurrenceSwitcher(card, chipsContainer, sorted, fieldsHtmlFn){
  const content = document.createElement("div");
  content.className = "occ-content";

  function renderContent(idx){
    const rec = sorted[idx];
    const p = classifyPermit(rec.permit);
    const icon = PERMIT_ICONS[p.cls] || PERMIT_ICONS["pb-unclear"];
    content.innerHTML = `
      <div class="permit-banner ${p.cls}">
        <div class="pb-left">
          <div class="permit-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">${icon}</svg></div>
          <span class="pb-tag">تصريح</span>
        </div>
        <span class="pb-value">${escapeHtml(p.text)}</span>
      </div>
      <div class="occ-date-box">
        <div class="odb-label">تاريخ الإرسال</div>
        <div class="odb-value">${escapeHtml(rec.day || "غير محدد")}</div>
      </div>
      <div class="record-rows">${fieldsHtmlFn(rec)}</div>
    `;
  }

  const defaultIdx = sorted.length - 1;

  sorted.forEach((rec, i)=>{
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "occ-chip" + (i === defaultIdx ? " active" : "");
    chip.textContent = i + 1;
    chip.addEventListener("click", ()=>{
      chipsContainer.querySelectorAll(".occ-chip").forEach(c=>c.classList.remove("active"));
      chip.classList.add("active");
      renderContent(i);
    });
    chipsContainer.appendChild(chip);
  });

  renderContent(defaultIdx);
  card.appendChild(content);
}

function searchIndividuals(query){
  const q = normalize(query);
  const resultsEl = document.getElementById("ind-results");
  const hintEl = document.getElementById("ind-hint");
  resultsEl.innerHTML = "";
  if(!q) return;
  hintEl.style.display = "none";

  let matches = [];
  let truncated = false;
  const qDigits = digitsOnly(q);
  if(qDigits.length >= 8){
    const byId = individualsGroups.get("ID:"+qDigits);
    if(byId) matches.push(byId);
  }
  if(matches.length === 0){
    if(window.__individualsByName.has(q)){
      matches = window.__individualsByName.get(q);
    }else{
      const found = [];
      individualsGroups.forEach(g=>{
        if(g.name && normalize(g.name).includes(q)) found.push(g);
      });
      if(found.length > 50){
        truncated = true;
        matches = found.slice(0, 50);
      }else{
        matches = found;
      }
    }
  }

  if(matches.length === 0){
    resultsEl.innerHTML = `
      <div class="empty-state">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        مفيش نتيجة مطابقة لـ <b>${escapeHtml(q)}</b>. تأكد إن الرقم القومى أو الاسم مكتوب زي ما هو بالظبط في الشيت.
      </div>`;
    return;
  }

  if(truncated){
    const note = document.createElement("div");
    note.className = "status-line";
    note.textContent = "فيه نتايج كتير مطابقة، ظاهر أول 50 بس. اكتب جزء أطول من الاسم عشان تضيّق البحث.";
    resultsEl.appendChild(note);
  }

  matches.forEach(g=>{
    const sorted = [...g.records].sort((a,b)=>{
      if(a.dayParsed && b.dayParsed) return a.dayParsed - b.dayParsed;
      if(a.dayParsed) return -1;
      if(b.dayParsed) return 1;
      return 0;
    });

    const card = document.createElement("div");
    card.className = "person-card";

    const head = document.createElement("div");
    head.className = "person-head";
    head.innerHTML = `
      <div class="record-top">
        <div class="occ-selector"></div>
        <div class="count-badge">${sorted.length} ${sorted.length===1 ? "تصريح" : "تصاريح"}</div>
      </div>
      <div class="record-identity">
        <div class="record-name">${escapeHtml(g.name || "بدون اسم")}</div>
        <div class="record-subid">${escapeHtml(g.nationalId || "غير مسجل")}</div>
      </div>
    `;
    card.appendChild(head);

    attachOccurrenceSwitcher(card, head.querySelector(".occ-selector"), sorted, rec => `
      <div class="record-row"><span class="k">الوظيفة</span><span class="v">${escapeHtml(rec.job || "—")}</span></div>
      <div class="record-row"><span class="k">العنوان</span><span class="v">${escapeHtml(rec.address || "—")}</span></div>
      <div class="record-row"><span class="k">المرسل</span><span class="v">${escapeHtml(rec.sender || "—")}</span></div>
      <div class="record-row"><span class="k">ملاحظات</span><span class="v">${escapeHtml(rec.note || "—")}</span></div>
    `);

    resultsEl.appendChild(card);
  });
}

/* ======================= Vehicles ======================= */

let vehiclesGroups = null;

// Fixed column order in "تصاريح مركبات": م, م, رقم السيارة, النوع, تابعه, تصريح, Mail Day
const VEH_COL = { PLATE:2, TYPE:3, OWNER:4, PERMIT:5, DAY:6 };

async function initVehicles(){

  if(VEHICLES_CSV_URL.startsWith("PUT_")){

    return;
  }
  try{
    const rows = await loadCSVRaw(VEHICLES_CSV_URL);
    const dataRows = rows.slice(1); // skip header row

    vehiclesGroups = new Map();

    dataRows.forEach(cols=>{
      if(!cols || cols.length < 3) return;
      const plateVal = normalize(cols[VEH_COL.PLATE]);
      if(!plateVal) return;
      const key = plateVal.replace(/\s+/g,"");
      if(!vehiclesGroups.has(key)){
        vehiclesGroups.set(key, {plate:plateVal, records:[]});
      }
      vehiclesGroups.get(key).records.push({
        plate:plateVal,
        type: normalize(cols[VEH_COL.TYPE]),

    statusEl.textContent = `حصل خطأ في تحميل بيانات المركبات (${detail}). لو بتجرب الملف من على جهازك مباشرة (file://) ده السبب الأشهر — لازم يتفتح من على سيرفر (GitHub Pages) عشان يقدر يجيب البيانات من جوجل.`;

function renderVehicleCard(g, resultsEl){
  const sorted = [...g.records].sort((a,b)=>{
    if(a.dayParsed && b.dayParsed) return a.dayParsed - b.dayParsed;
    if(a.dayParsed) return -1;
    if(b.dayParsed) return 1;
    return 0;
  });

  const card = document.createElement("div");
  card.className = "person-card";
  const head = document.createElement("div");
  head.className = "person-head";
  head.innerHTML = `
    <div class="record-top">
      <div class="occ-selector"></div>

    </div>
  `;
  card.appendChild(head);

  attachOccurrenceSwitcher(card, head.querySelector(".occ-selector"), sorted, rec => `
    <div class="record-row"><span class="k">النوع</span><span class="v">${escapeHtml(rec.type || "—")}</span></div>

function searchVehicles(query){
  const qRaw = normalize(query).replace(/\s+/g,"");
  const resultsEl = document.getElementById("veh-results");
  const hintEl = document.getElementById("veh-hint");
  resultsEl.innerHTML = "";
  if(!qRaw) return;
  hintEl.style.display = "none";

  const isDigitsOnly = /^[0-9٠-٩]+$/.test(qRaw);

  if(!isDigitsOnly){
    // has letters (with or without numbers) -> exact plate match, as written in the sheet
    const g = vehiclesGroups.get(qRaw);
    if(!g){
      resultsEl.innerHTML = `
        <div class="empty-state">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          مفيش نتيجة مطابقة لرقم السيارة <b>${escapeHtml(query)}</b>. تأكد إنه مكتوب زي ما هو بالظبط في الشيت.
        </div>`;
      return;
    }
    renderVehicleCard(g, resultsEl);
    return;
  }

  // digits only -> show every vehicle whose plate contains this number anywhere
  const found = [];
  vehiclesGroups.forEach((g, key)=>{
    if(key.includes(qRaw)) found.push(g);
  });

  if(found.length === 0){
    resultsEl.innerHTML = `
      <div class="empty-state">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        مفيش أي سيارة رقمها فيه <b>${escapeHtml(query)}</b>.
      </div>`;
    return;
  }

  let list = found;
  if(found.length > 50){
    const note = document.createElement("div");
    note.className = "status-line";
    note.textContent = "فيه نتايج كتير مطابقة، ظاهر أول 50 بس. اكتب رقم أطول عشان تضيّق البحث.";
    resultsEl.appendChild(note);
    list = found.slice(0, 50);
  }

  list.forEach(g => renderVehicleCard(g, resultsEl));
}

/* ======================= Utils ======================= */

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/* ======================= Wiring ======================= */

document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.dataset.tab;
    document.getElementById("page-individuals").style.display = tab==="individuals" ? "block" : "none";
    document.getElementById("page-vehicles").style.display = tab==="vehicles" ? "block" : "none";
  });
});

document.getElementById("ind-btn").addEventListener("click", ()=> searchIndividuals(document.getElementById("ind-input").value));
document.getElementById("ind-input").addEventListener("keydown", e=>{ if(e.key==="Enter") searchIndividuals(e.target.value); });

document.getElementById("veh-btn").addEventListener("click", ()=> searchVehicles(document.getElementById("veh-input").value));
document.getElementById("veh-input").addEventListener("keydown", e=>{ if(e.key==="Enter") searchVehicles(e.target.value); });

function setSystemStatus(state){
  const dot = document.getElementById("system-status-dot");
  const label = document.getElementById("system-status-label");
  dot.classList.remove("updating","error");
  if(state === "error"){
    dot.classList.add("error");
    label.textContent = "خطأ في الاتصال";
  }else{
    label.textContent = "متصل";
  }
}

Promise.all([initIndividuals(), initVehicles()]).then(results=>{
  const anyError = results.some(r => r === false);
  setSystemStatus(anyError ? "error" : "online");
});

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").then(reg => reg.update()).catch(()=>{});
  });
}
</script>
</body>
