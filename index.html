<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCM Permission Search</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1117">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NCM Permits">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>

/* ============ CONFIG =============
   استبدل اللينكات دي بلينكات الـ CSV بتاعتك بعد ما تعمل:
   Google Sheet > File > Share > Publish to web > اختار التاب المطلوب > CSV
================================== */

:root{
  --bg-deep:#0B1117;
  --bg-mid:#0e1620;
  --glass:rgba(255,255,255,0.06);
  --glass-border:rgba(255,255,255,0.14);
  --gold:#17e0c3;
  --gold-soft:#5ef2dc;
  --gold-dim:#0c8a78;
  --text-main:#f4f1e9;
  --text-dim:#9fb3ae;
  --ok:#3ecf8e;
  --ok-bg:rgba(62,207,142,0.14);
  --soon:#f0c14b;
  --soon-bg:rgba(240,193,75,0.16);
  --bad:#ef6a6a;
  --bad-bg:rgba(239,106,106,0.16);
  --ban:#ff3b3b;
  --unclear:#a8b5b2;
  --unclear-bg:rgba(168,181,178,0.14);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  font-family:'IBM Plex Sans Arabic','Tajawal',sans-serif;
  color:var(--text-main);
  background:
    repeating-linear-gradient(0deg, rgba(23,224,195,0.045) 0px, rgba(23,224,195,0.045) 1px, transparent 1px, transparent 28px),
    repeating-linear-gradient(90deg, rgba(23,224,195,0.045) 0px, rgba(23,224,195,0.045) 1px, transparent 1px, transparent 28px),
    radial-gradient(circle at 50% 0%, rgba(23,224,195,0.08), transparent 55%),
    linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
  background-attachment:fixed;
}

.emblem{
  position:fixed;
  top:-140px; left:50%;
  transform:translateX(-50%);
  width:600px; height:600px;
  border-radius:50%;
  border:1px dashed rgba(23,224,195,0.16);
  pointer-events:none;
  z-index:0;
}
.emblem::before{
  content:"";
  position:absolute; inset:44px;
  border-radius:50%;
  border:1px solid rgba(23,224,195,0.10);
}
.emblem::after{
  content:"";
  position:absolute; inset:88px;
  border-radius:50%;
  border:1px solid rgba(23,224,195,0.07);
}

.wrap{
  position:relative; z-index:1;
  max-width:920px;
  margin:0 auto;
  padding:36px 20px 80px;
}

header.top{
  margin-bottom:10px;
}
.header-row{
  position:relative;
  min-height:52px;
  margin-bottom:26px;
}
.ks-name{
  position:absolute;
  top:50%; right:0;
  transform:translateY(-50%);
  font-family:'Tajawal',sans-serif;
  font-weight:700;
  font-size:14px;
  letter-spacing:1px;
  color:var(--text-main);
  white-space:nowrap;
}
.ncm-logo{
  position:absolute;
  top:50%; left:0;
  transform:translateY(-50%);
  display:flex;
  align-items:center;
  gap:8px;
}
.ncm-logo-text{
  font-family:'Tajawal',sans-serif;
  font-weight:900;
  font-size:22px;
  letter-spacing:1px;
  color:var(--text-main);
}

@media (max-width:420px){
  .ks-name{ font-size:12px; }
  .ncm-logo-text{ font-size:18px; }
  .ncm-logo svg{ width:32px; height:32px; }
}

.title-block{
  text-align:center;
}
header.top h1{
  font-family:'Tajawal',sans-serif;
  font-weight:900;
  font-size:clamp(26px,4.4vw,36px);
  margin:0 0 10px;
  letter-spacing:.5px;
}
.title-rule{
  width:120px;
  height:2px;
  margin:0 auto;
  background:linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
}
.section-kicker{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  font-family:'Tajawal',sans-serif;
  font-weight:900;
  font-size:clamp(14px,2.4vw,18px);
  letter-spacing:5px;
  color:var(--gold-soft);
  margin:26px 0 6px;
}
.section-kicker::before, .section-kicker::after{
  content:"";
  height:1px;
  width:44px;
  background:linear-gradient(90deg, transparent, rgba(23,224,195,0.5));
}
.section-kicker::after{ background:linear-gradient(90deg, rgba(23,224,195,0.5), transparent); }

.tabs{
  display:flex;
  gap:10px;
  justify-content:center;
  margin:10px 0 22px;
}
.tab-btn{
  flex:1;
  max-width:220px;
  padding:14px 18px;
  border-radius:14px;
  border:1px solid var(--glass-border);
  background:var(--glass);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  color:var(--text-main);
  font-family:inherit;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:all .2s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.tab-btn:hover{ border-color:rgba(23,224,195,0.4); }
.tab-btn.active{
  background:linear-gradient(135deg, rgba(23,224,195,0.26), rgba(23,224,195,0.08));
  border-color:var(--gold);
  box-shadow:0 0 0 1px rgba(23,224,195,0.3) inset, 0 8px 20px rgba(23,224,195,0.15);
  color:var(--gold-soft);
}
.tab-btn:not(.active){ color:var(--text-dim); }

.search-card{
  background:var(--glass);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-radius:20px;
  padding:24px;
  box-shadow:0 24px 70px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
}
.search-row{
  display:flex;
  gap:10px;
}
.search-row input{
  flex:1;
  padding:15px 18px;
  border-radius:12px;
  border:1px solid var(--glass-border);
  background:rgba(0,0,0,0.25);
  color:var(--text-main);
  font-family:inherit;
  font-size:16px;
  outline:none;
  transition:border-color .2s ease, box-shadow .2s ease;
}
.search-row input::placeholder{color:var(--text-dim);}
.search-row input:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(23,224,195,0.15);}
.search-row button{
  padding:0 26px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.3);
  background:linear-gradient(135deg, var(--gold-soft), var(--gold) 60%, #0c8a78);
  color:#1a1305;
  font-family:inherit;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
  box-shadow:0 8px 22px rgba(23,224,195,0.3);
  transition:transform .15s ease;
}
.search-row button:hover{ filter:brightness(1.05); }
.search-row button:active{transform:translateY(1px);}
.hint{
  margin-top:10px;
  font-size:12.5px;
  color:var(--text-dim);
}

.status-line{
  text-align:center;
  color:var(--text-dim);
  font-size:13px;
  margin-top:14px;
  min-height:18px;
}

.results{
  margin-top:26px;
  display:flex;
  flex-direction:column;
  gap:18px;
}

.person-card{
  background:var(--glass);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 20px 55px rgba(0,0,0,0.35);
}
.person-head{
  padding:18px 20px;
  border-bottom:1px solid var(--glass-border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.identity-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  flex:1;
}
.id-tab{
  background:rgba(23,224,195,0.08);
  border:1px solid rgba(23,224,195,0.3);
  border-radius:12px;
  padding:9px 14px;
  min-width:140px;
}
.id-tab .k{
  display:block;
  font-size:10.5px;
  color:var(--gold-soft);
  font-weight:700;
  margin-bottom:2px;
  letter-spacing:.5px;
}
.id-tab .v{
  font-size:15px;
  font-weight:700;
  color:var(--text-main);
  font-family:'Tajawal',sans-serif;
}
.id-tab-name{ flex:1.4; min-width:180px; }
.count-badge{
  background:rgba(23,224,195,0.16);
  border:1px solid rgba(23,224,195,0.4);
  color:var(--gold-soft);
  font-size:12.5px;
  font-weight:700;
  padding:6px 12px;
  border-radius:100px;
  white-space:nowrap;
}

.occ-selector{
  display:flex;
  gap:8px;
  padding:14px 20px 0;
  overflow-x:auto;
}
.occ-chip{
  flex-shrink:0;
  min-width:36px;
  height:36px;
  padding:0 12px;
  border-radius:10px;
  border:1px solid var(--glass-border);
  background:rgba(255,255,255,0.04);
  color:var(--text-dim);
  font-family:inherit;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:all .15s ease;
}
.occ-chip:hover{ border-color:rgba(23,224,195,0.4); color:var(--text-main); }
.occ-chip.active{
  background:linear-gradient(135deg, rgba(23,224,195,0.26), rgba(23,224,195,0.08));
  border-color:var(--gold);
  color:var(--gold-soft);
}

.occ-content{
  padding:16px 20px;
}

.occ{
  padding:16px 20px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.occ:last-child{border-bottom:none;}

.occ-banner{
  background:linear-gradient(135deg, rgba(23,224,195,0.10), rgba(23,224,195,0.03));
  border:1px solid rgba(23,224,195,0.28);
  border-radius:16px;
  padding:14px 16px;
  margin-bottom:14px;
}
.occ-label{
  font-size:12.5px;
  font-weight:700;
  color:var(--gold-soft);
  margin-bottom:10px;
}

.permit-tab{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:13px 16px;
  border-radius:12px;
  border:1.5px solid transparent;
}
.permit-tab .pt-label{
  font-size:12px;
  font-weight:700;
  opacity:.85;
}
.permit-tab .pt-value{
  font-size:17px;
  font-weight:900;
}
.pb-ok{background:var(--ok-bg); color:var(--ok); border-color:rgba(62,207,142,0.4);}
.pb-soon{background:var(--soon-bg); color:var(--soon); border-color:rgba(240,193,75,0.4);}
.pb-bad{background:var(--bad-bg); color:var(--bad); border-color:rgba(239,106,106,0.4);}
.pb-ban{background:var(--ban); color:#fff; border-color:var(--ban);}
.pb-unclear{background:var(--unclear-bg); color:var(--unclear); border-color:rgba(168,181,178,0.4);}

.fields{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.field{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;
  padding:11px 14px;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}
.field .k{
  color:var(--text-dim);
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  flex-shrink:0;
}
.field .v{
  font-weight:600;
  color:var(--text-main);
  text-align:left;
  flex:1;
}

.empty-state{
  text-align:center;
  color:var(--text-dim);
  padding:50px 20px;
  font-size:14px;
}
.empty-state b{color:var(--text-main);}

footer{
  text-align:center;
  color:var(--text-dim);
  font-size:12px;
  margin-top:50px;
  opacity:.7;
}

@media (max-width:600px){
  .search-row{flex-direction:column;}
  .search-row button{padding:14px;}
}
/* ======================= Lock Screen ======================= */

#app-root{ display:none; }
body.unlocked #app-root{ display:block; }
body.unlocked #lock-screen{ display:none; }

#lock-screen{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
  padding:24px;
}
.lock-ring-bg{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:340px; height:340px;
  border-radius:50%;
  border:1px solid rgba(23,224,195,0.10);
  pointer-events:none;
}
.lock-ring-bg::before{
  content:"";
  position:absolute; inset:34px;
  border-radius:50%;
  border:1px solid rgba(23,224,195,0.07);
}

.lock-card{
  position:relative;
  z-index:1;
  width:100%;
  max-width:340px;
  text-align:center;
}
.lock-logo{
  display:flex;
  justify-content:center;
  margin-bottom:14px;
  filter:drop-shadow(0 6px 18px rgba(23,224,195,0.18));
}
.lock-card h1{
  font-family:'Tajawal',sans-serif;
  font-weight:900;
  font-size:24px;
  color:var(--text-main);
  margin:0 0 6px;
}
.lock-kicker{
  font-size:11px;
  letter-spacing:4px;
  color:var(--gold-soft);
  font-weight:700;
  margin-bottom:36px;
}

.pin-label{
  font-size:13px;
  color:var(--text-dim);
  margin-bottom:16px;
}
.pin-dots{
  display:flex;
  justify-content:center;
  gap:16px;
  margin-bottom:10px;
}
.pin-dot{
  width:14px;
  height:14px;
  border-radius:50%;
  border:1.5px solid rgba(23,224,195,0.4);
  background:transparent;
  transition:background .15s ease, transform .15s ease, border-color .15s ease;
}
.pin-dot.filled{
  background:var(--gold);
  border-color:var(--gold);
  transform:scale(1.1);
}
.pin-dots.shake{
  animation:pinShake .4s ease;
}
.pin-dots.shake .pin-dot{
  border-color:var(--bad);
}
@keyframes pinShake{
  10%,90% { transform:translateX(-1px); }
  20%,80% { transform:translateX(2px); }
  30%,50%,70% { transform:translateX(-5px); }
  40%,60% { transform:translateX(5px); }
}

.pin-error{
  height:16px;
  font-size:12.5px;
  color:var(--bad);
  margin-bottom:14px;
  opacity:0;
  transition:opacity .15s ease;
}
.pin-error.show{ opacity:1; }

.pin-hidden-input{
  position:absolute;
  opacity:0;
  pointer-events:none;
  width:1px;
  height:1px;
}

.pin-pad{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:12px;
  max-width:280px;
  margin:0 auto;
}
.pin-key{
  aspect-ratio:1;
  border-radius:16px;
  border:1px solid var(--glass-border);
  background:var(--glass);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:var(--text-main);
  font-family:'Tajawal',sans-serif;
  font-size:20px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all .12s ease;
}
.pin-key:hover{ border-color:rgba(23,224,195,0.4); }
.pin-key:active{ transform:scale(0.94); background:rgba(23,224,195,0.12); }
.pin-key-action{ color:var(--gold-soft); }

@media (max-width:380px){
  .pin-pad{ max-width:240px; gap:10px; }
  .lock-card h1{ font-size:21px; }
}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-ring-bg"></div>
  <div class="lock-card">
    <div class="lock-logo">
      <svg width="72" height="72" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M20 20 L26 10 L74 10 L80 20 L80 44 Q80 68 50 90 Q20 68 20 44 Z"
              fill="none" stroke="var(--gold)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
        <g transform="translate(50 44)">
          <circle r="15.5" fill="none" stroke="var(--gold)" stroke-width="3.8" stroke-dasharray="75 15" stroke-dashoffset="-5" transform="rotate(-90)"/>
          <circle r="12.4" fill="none" stroke="var(--gold-dim)" stroke-width="2.4" stroke-dasharray="20 50" stroke-dashoffset="-45" transform="rotate(-90)"/>
          <circle r="2.6" fill="var(--gold)"/>
        </g>
      </svg>
    </div>
    <h1>بحث التصاريح</h1>
    <div class="lock-kicker">SECURE ACCESS</div>

    <div class="pin-label">أدخل رمز الدخول</div>
    <div class="pin-dots" id="pin-dots">
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
    </div>
    <div class="pin-error" id="pin-error">رمز الدخول غير صحيح</div>

    <input id="pin-hidden-input" type="tel" inputmode="numeric" autocomplete="off" maxlength="4" class="pin-hidden-input" aria-label="رمز الدخول">

    <div class="pin-pad">
      <button type="button" class="pin-key" data-digit="1">1</button>
      <button type="button" class="pin-key" data-digit="2">2</button>
      <button type="button" class="pin-key" data-digit="3">3</button>
      <button type="button" class="pin-key" data-digit="4">4</button>
      <button type="button" class="pin-key" data-digit="5">5</button>
      <button type="button" class="pin-key" data-digit="6">6</button>
      <button type="button" class="pin-key" data-digit="7">7</button>
      <button type="button" class="pin-key" data-digit="8">8</button>
      <button type="button" class="pin-key" data-digit="9">9</button>
      <button type="button" class="pin-key pin-key-action" id="pin-backspace" aria-label="مسح">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 4H8l-6 8 6 8h13a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1z"/><path d="M15 10l-4 4M11 10l4 4"/></svg>
      </button>
      <button type="button" class="pin-key" data-digit="0">0</button>
      <button type="button" class="pin-key pin-key-action" id="pin-submit" aria-label="دخول">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
      </button>
    </div>
  </div>
</div>


<div id="app-root">
<div class="emblem"></div>

<div class="wrap">
  <header class="top">
    <div class="header-row">
      <div class="ks-name">KHALED SABRY</div>
      <div class="ncm-logo">
        <span class="ncm-logo-text">NCM</span>
        <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="24" fill="none" stroke="var(--gold)" stroke-width="8" stroke-dasharray="150 30" stroke-dashoffset="-10" transform="rotate(-90 32 32)"/>
          <circle cx="32" cy="32" r="20" fill="none" stroke="var(--gold-dim)" stroke-width="5" stroke-dasharray="40 100" stroke-dashoffset="-90" transform="rotate(-90 32 32)"/>
          <circle cx="32" cy="32" r="5" fill="var(--gold)"/>
        </svg>
      </div>
    </div>
    <div class="title-block">
      <h1>بحث التصاريح</h1>
      <div class="title-rule"></div>
    </div>
  </header>

  <div class="section-kicker">PERMISSION SEARCH</div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="individuals">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      الأفراد
    </button>
    <button class="tab-btn" data-tab="vehicles">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 13l1.5-5A2 2 0 0 1 6.4 6.5h11.2a2 2 0 0 1 1.9 1.5L21 13"/><rect x="3" y="13" width="18" height="5" rx="1"/><circle cx="7" cy="18.5" r="1.4"/><circle cx="17" cy="18.5" r="1.4"/></svg>
      المركبات
    </button>
  </div>

  <!-- ============ صفحة الأفراد ============ -->
  <section id="page-individuals">
    <div class="search-card">
      <div class="search-row">
        <input id="ind-input" type="text" placeholder="">
        <button id="ind-btn">بحث</button>
      </div>
    </div>
    <div class="status-line" id="ind-status">جاري تحميل بيانات الأفراد...</div>
    <div class="results" id="ind-results"></div>
  </section>

  <!-- ============ صفحة المركبات ============ -->
  <section id="page-vehicles" style="display:none;">
    <div class="search-card">
      <div class="search-row">
        <input id="veh-input" type="text" placeholder="">
        <button id="veh-btn">بحث</button>
      </div>
    </div>
    <div class="status-line" id="veh-status">جاري تحميل بيانات المركبات...</div>
    <div class="results" id="veh-results"></div>
  </section>

</div>
</div>

<script>
/* ======================= Lock Screen (UI access lock, client-side only) ======================= */
(function(){
  const CORRECT_PIN = "1804";
  let entered = "";

  const dotsWrap = document.getElementById("pin-dots");
  const dots = dotsWrap.querySelectorAll(".pin-dot");
  const errorEl = document.getElementById("pin-error");
  const hiddenInput = document.getElementById("pin-hidden-input");

  function renderDots(){
    dots.forEach((d,i)=> d.classList.toggle("filled", i < entered.length));
  }

  function clearError(){
    errorEl.classList.remove("show");
    dotsWrap.classList.remove("shake");
  }

  function showError(){
    errorEl.classList.add("show");
    dotsWrap.classList.add("shake");
    setTimeout(()=>{
      entered = "";
      hiddenInput.value = "";
      renderDots();
      dotsWrap.classList.remove("shake");
    }, 420);
  }

  function unlock(){
    document.body.classList.add("unlocked");
  }

  function checkIfComplete(){
    if(entered.length === 4){
      if(entered === CORRECT_PIN){
        clearError();
        unlock();
      }else{
        showError();
      }
    }
  }

  function addDigit(d){
    if(entered.length >= 4) return;
    clearError();
    entered += d;
    hiddenInput.value = entered;
    renderDots();
    checkIfComplete();
  }

  function removeDigit(){
    entered = entered.slice(0, -1);
    hiddenInput.value = entered;
    clearError();
    renderDots();
  }

  document.querySelectorAll(".pin-key[data-digit]").forEach(btn=>{
    btn.addEventListener("click", ()=> addDigit(btn.dataset.digit));
  });
  document.getElementById("pin-backspace").addEventListener("click", removeDigit);
  document.getElementById("pin-submit").addEventListener("click", checkIfComplete);

  hiddenInput.addEventListener("input", ()=>{
    entered = hiddenInput.value.replace(/[^0-9]/g,"").slice(0,4);
    hiddenInput.value = entered;
    clearError();
    renderDots();
    checkIfComplete();
  });

  document.addEventListener("keydown", (e)=>{
    if(document.body.classList.contains("unlocked")) return;
    if(e.key >= "0" && e.key <= "9") addDigit(e.key);
    else if(e.key === "Backspace") removeDigit();
    else if(e.key === "Enter") checkIfComplete();
  });

  // Tapping anywhere on the card focuses the hidden input so the device's own numeric keyboard can be used too.
  document.querySelector(".lock-card").addEventListener("click", ()=> hiddenInput.focus());
  hiddenInput.focus();
})();
</script>

<script>
/* ======================= CONFIG ======================= */
// حط هنا لينكات الـ CSV اللي هتاخدها من: Google Sheet > Share > Publish to web > اختار التاب > CSV
const INDIVIDUALS_CSV_URL = "https://docs.google.com/spreadsheets/d/18EH8aogUF0qZeLFjku7uiF3e9a_TjCTojRd53qMx0a0/gviz/tq?tqx=out:csv&gid=1465451083";
const VEHICLES_CSV_URL    = "https://docs.google.com/spreadsheets/d/18EH8aogUF0qZeLFjku7uiF3e9a_TjCTojRd53qMx0a0/gviz/tq?tqx=out:csv&gid=383739446";

/* ======================= Helpers ======================= */

function normalize(s){
  if(s===null || s===undefined) return "";
  return String(s).replace(/\s+/g," ").trim();
}

function digitsOnly(s){
  return normalize(s).replace(/[^\d]/g,"");
}

const ORDINALS = ["الأولى","الثانية","الثالثة","الرابعة","الخامسة","السادسة","السابعة","الثامنة","التاسعة","العاشرة"];
function occurrenceLabel(i){
  // i is 0-indexed
  if(i < ORDINALS.length) return "المرة " + ORDINALS[i];
  return "المرة رقم " + (i+1);
}

const BAN_WORDS = ["منع"];
const RENEW_WORDS = ["عايز تجديد","الرخصه منتهيه","غيرت لوحات","تجديد"];
const TEMP_WORDS = ["مؤقت"];
const UNCLEAR_VALUES = new Set(["؟؟","??","??????????","N.D","T","?"]);

function parseDateLoose(v){
  if(!v) return null;
  const s = normalize(v);
  const m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  if(!m) return null;
  const day = parseInt(m[1],10), month = parseInt(m[2],10), year = parseInt(m[3],10);
  const d = new Date(year, month-1, day);
  if(isNaN(d.getTime())) return null;
  return d;
}

function classifyPermit(value){
  const s = normalize(value);
  if(!s) return {text:"—", cls:"pb-unclear"};
  if(UNCLEAR_VALUES.has(s)) return {text:s, cls:"pb-unclear"};
  if(BAN_WORDS.some(w=>s.includes(w))) return {text:s, cls:"pb-ban"};
  if(RENEW_WORDS.some(w=>s.includes(w))) return {text:s, cls:"pb-bad"};
  if(TEMP_WORDS.some(w=>s.includes(w))) return {text:s, cls:"pb-unclear"};

  const d = parseDateLoose(s);
  if(d){
    const today = new Date();
    today.setHours(0,0,0,0);
    const diffDays = Math.round((d - today) / 86400000);
    if(diffDays < 0) return {text:s, cls:"pb-bad"};
    if(diffDays <= 30) return {text:s, cls:"pb-soon"};
    return {text:s, cls:"pb-ok"};
  }
  return {text:s, cls:"pb-unclear"};
}

function isSeparatorRow(row, keyField){
  // separator/blank rows have no meaningful key value
  return !normalize(row[keyField]);
}

function loadCSV(url){
  return new Promise((resolve, reject)=>{
    Papa.parse(url, {
      download:true,
      header:true,
      skipEmptyLines:false,
      complete: (res)=> resolve(res.data),
      error: (err)=> reject(err)
    });
  });
}

function findHeaderKey(sampleRow, target){
  return Object.keys(sampleRow).find(k => normalize(k) === target);
}

function loadCSVRaw(url){
  return new Promise((resolve, reject)=>{
    Papa.parse(url, {
      download:true,
      header:false,
      skipEmptyLines:false,
      complete: (res)=> resolve(res.data),
      error: (err)=> reject(err)
    });
  });
}

/* ======================= Individuals ======================= */

let individualsGroups = null; // Map key -> {name, nationalId, records:[...]}

// Fixed column order in "تصاريح أفراد": م, م, الاسم, الوظيفة, الرقم القومى, العنوان, ملاحظات, المرسل, تصريح, Mali Day
const IND_COL = { NAME:2, JOB:3, ID:4, ADDR:5, NOTE:6, SENDER:7, PERMIT:8, DAY:9 };

async function initIndividuals(){
  const statusEl = document.getElementById("ind-status");
  if(INDIVIDUALS_CSV_URL.startsWith("PUT_")){
    statusEl.textContent = "لسه محتاج تحط لينك الـ CSV الخاص بشيت الأفراد فوق في الكود (INDIVIDUALS_CSV_URL).";
    return;
  }
  try{
    const rows = await loadCSVRaw(INDIVIDUALS_CSV_URL);
    const dataRows = rows.slice(1); // skip header row

    individualsGroups = new Map();

    dataRows.forEach(cols=>{
      if(!cols || cols.length < 5) return;
      const idVal = normalize(cols[IND_COL.ID]);
      const nameVal = normalize(cols[IND_COL.NAME]);
      if(!idVal && !nameVal) return; // separator / empty row

      const key = idVal ? ("ID:"+digitsOnly(idVal)) : ("NAME:"+nameVal);
      if(!individualsGroups.has(key)){
        individualsGroups.set(key, { name:nameVal, nationalId:idVal, records:[] });
      }
      const g = individualsGroups.get(key);
      g.records.push({
        name:nameVal, nationalId:idVal,
        job: normalize(cols[IND_COL.JOB]),
        address: normalize(cols[IND_COL.ADDR]),
        note: normalize(cols[IND_COL.NOTE]),
        sender: normalize(cols[IND_COL.SENDER]),
        permit: cols[IND_COL.PERMIT],
        day: cols[IND_COL.DAY],
        dayParsed: parseDateLoose(cols[IND_COL.DAY])
      });
    });

    window.__individualsByName = new Map();
    individualsGroups.forEach((g)=>{
      const nameKey = normalize(g.name);
      if(!nameKey) return;
      if(!window.__individualsByName.has(nameKey)) window.__individualsByName.set(nameKey, []);
      window.__individualsByName.get(nameKey).push(g);
    });

    statusEl.textContent = "";
  }catch(err){
    const detail = (err && (err.message || err.toString())) || "غير معروف";
    statusEl.textContent = `حصل خطأ في تحميل بيانات الأفراد (${detail}). لو بتجرب الملف من على جهازك مباشرة (file://) ده السبب الأشهر — لازم يتفتح من على سيرفر (GitHub Pages) عشان يقدر يجيب البيانات من جوجل.`;
    console.error(err);
  }
}

function renderOccurrenceSwitcher(card, sorted, fieldsHtmlFn){
  const selector = document.createElement("div");
  selector.className = "occ-selector";

  const content = document.createElement("div");
  content.className = "occ-content";

  function renderContent(idx){
    const rec = sorted[idx];
    const p = classifyPermit(rec.permit);
    content.innerHTML = `
      <div class="occ-banner">
        <div class="occ-label">${occurrenceLabel(idx)} — تم الإرسال: ${escapeHtml(rec.day || "غير محدد")}</div>
        <div class="permit-tab ${p.cls}">
          <span class="pt-label">حالة التصريح</span>
          <span class="pt-value">${escapeHtml(p.text)}</span>
        </div>
      </div>
      <div class="fields">${fieldsHtmlFn(rec)}</div>
    `;
  }

  const defaultIdx = sorted.length - 1;

  if(sorted.length > 1){
    sorted.forEach((rec, i)=>{
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "occ-chip" + (i === defaultIdx ? " active" : "");
      chip.textContent = i + 1;
      chip.addEventListener("click", ()=>{
        selector.querySelectorAll(".occ-chip").forEach(c=>c.classList.remove("active"));
        chip.classList.add("active");
        renderContent(i);
      });
      selector.appendChild(chip);
    });
    card.appendChild(selector);
  }

  renderContent(defaultIdx);
  card.appendChild(content);
}

function searchIndividuals(query){
  const q = normalize(query);
  const resultsEl = document.getElementById("ind-results");
  resultsEl.innerHTML = "";
  if(!q) return;

  let matches = [];
  let truncated = false;
  const qDigits = digitsOnly(q);
  if(qDigits.length >= 8){
    const byId = individualsGroups.get("ID:"+qDigits);
    if(byId) matches.push(byId);
  }
  if(matches.length === 0){
    if(window.__individualsByName.has(q)){
      matches = window.__individualsByName.get(q);
    }else{
      const found = [];
      individualsGroups.forEach(g=>{
        if(g.name && normalize(g.name).includes(q)) found.push(g);
      });
      if(found.length > 50){
        truncated = true;
        matches = found.slice(0, 50);
      }else{
        matches = found;
      }
    }
  }

  if(matches.length === 0){
    resultsEl.innerHTML = `<div class="empty-state">مفيش نتيجة مطابقة لـ <b>${escapeHtml(q)}</b>. تأكد إن الرقم القومى أو الاسم مكتوب زي ما هو بالظبط في الشيت.</div>`;
    return;
  }

  if(truncated){
    const note = document.createElement("div");
    note.className = "status-line";
    note.textContent = "فيه نتايج كتير مطابقة، ظاهر أول 50 بس. اكتب جزء أطول من الاسم عشان تضيّق البحث.";
    resultsEl.appendChild(note);
  }

  matches.forEach(g=>{
    const sorted = [...g.records].sort((a,b)=>{
      if(a.dayParsed && b.dayParsed) return a.dayParsed - b.dayParsed;
      if(a.dayParsed) return -1;
      if(b.dayParsed) return 1;
      return 0;
    });

    const card = document.createElement("div");
    card.className = "person-card";

    const head = document.createElement("div");
    head.className = "person-head";
    head.innerHTML = `
      <div class="identity-row">
        <div class="id-tab id-tab-name"><span class="k">الاسم</span><span class="v">${escapeHtml(g.name || "بدون اسم")}</span></div>
        <div class="id-tab id-tab-id"><span class="k">الرقم القومى</span><span class="v">${escapeHtml(g.nationalId || "غير مسجل")}</span></div>
      </div>
      <div class="count-badge">${sorted.length} ${sorted.length===1 ? "تصريح" : "تصاريح"}</div>
    `;
    card.appendChild(head);

    renderOccurrenceSwitcher(card, sorted, rec => `
      <div class="field"><span class="k">الوظيفة</span><span class="v">${escapeHtml(rec.job || "—")}</span></div>
      <div class="field"><span class="k">العنوان</span><span class="v">${escapeHtml(rec.address || "—")}</span></div>
      <div class="field"><span class="k">المرسل</span><span class="v">${escapeHtml(rec.sender || "—")}</span></div>
      <div class="field"><span class="k">ملاحظات</span><span class="v">${escapeHtml(rec.note || "—")}</span></div>
    `);

    resultsEl.appendChild(card);
  });
}

/* ======================= Vehicles ======================= */

let vehiclesGroups = null;

// Fixed column order in "تصاريح مركبات": م, م, رقم السيارة, النوع, تابعه, تصريح, Mail Day
const VEH_COL = { PLATE:2, TYPE:3, OWNER:4, PERMIT:5, DAY:6 };

async function initVehicles(){
  const statusEl = document.getElementById("veh-status");
  if(VEHICLES_CSV_URL.startsWith("PUT_")){
    statusEl.textContent = "لسه محتاج تحط لينك الـ CSV الخاص بشيت المركبات فوق في الكود (VEHICLES_CSV_URL).";
    return;
  }
  try{
    const rows = await loadCSVRaw(VEHICLES_CSV_URL);
    const dataRows = rows.slice(1); // skip header row

    vehiclesGroups = new Map();

    dataRows.forEach(cols=>{
      if(!cols || cols.length < 3) return;
      const plateVal = normalize(cols[VEH_COL.PLATE]);
      if(!plateVal) return;
      const key = plateVal.replace(/\s+/g,"");
      if(!vehiclesGroups.has(key)){
        vehiclesGroups.set(key, {plate:plateVal, records:[]});
      }
      vehiclesGroups.get(key).records.push({
        plate:plateVal,
        type: normalize(cols[VEH_COL.TYPE]),
        owner: normalize(cols[VEH_COL.OWNER]),
        permit: cols[VEH_COL.PERMIT],
        day: cols[VEH_COL.DAY],
        dayParsed: parseDateLoose(cols[VEH_COL.DAY])
      });
    });

    statusEl.textContent = "";
  }catch(err){
    const detail = (err && (err.message || err.toString())) || "غير معروف";
    statusEl.textContent = `حصل خطأ في تحميل بيانات المركبات (${detail}). لو بتجرب الملف من على جهازك مباشرة (file://) ده السبب الأشهر — لازم يتفتح من على سيرفر (GitHub Pages) عشان يقدر يجيب البيانات من جوجل.`;
    console.error(err);
  }
}

function renderVehicleCard(g, resultsEl){
  const sorted = [...g.records].sort((a,b)=>{
    if(a.dayParsed && b.dayParsed) return a.dayParsed - b.dayParsed;
    if(a.dayParsed) return -1;
    if(b.dayParsed) return 1;
    return 0;
  });

  const card = document.createElement("div");
  card.className = "person-card";
  const head = document.createElement("div");
  head.className = "person-head";
  head.innerHTML = `
    <div class="identity-row">
      <div class="id-tab id-tab-name"><span class="k">رقم السيارة</span><span class="v">${escapeHtml(g.plate)}</span></div>
      <div class="id-tab id-tab-id"><span class="k">النوع / تابعه</span><span class="v">${escapeHtml(sorted[0].type || "—")}${sorted[0].owner ? " · " + escapeHtml(sorted[0].owner) : ""}</span></div>
    </div>
    <div class="count-badge">${sorted.length} ${sorted.length===1 ? "تصريح" : "تصاريح"}</div>
  `;
  card.appendChild(head);

  renderOccurrenceSwitcher(card, sorted, rec => `
    <div class="field"><span class="k">النوع</span><span class="v">${escapeHtml(rec.type || "—")}</span></div>
    <div class="field"><span class="k">تابعه</span><span class="v">${escapeHtml(rec.owner || "—")}</span></div>
  `);

  resultsEl.appendChild(card);
}

function searchVehicles(query){
  const qRaw = normalize(query).replace(/\s+/g,"");
  const resultsEl = document.getElementById("veh-results");
  resultsEl.innerHTML = "";
  if(!qRaw) return;

  const isDigitsOnly = /^[0-9٠-٩]+$/.test(qRaw);

  if(!isDigitsOnly){
    // has letters (with or without numbers) -> exact plate match, as written in the sheet
    const g = vehiclesGroups.get(qRaw);
    if(!g){
      resultsEl.innerHTML = `<div class="empty-state">مفيش نتيجة مطابقة لرقم السيارة <b>${escapeHtml(query)}</b>. تأكد إنه مكتوب زي ما هو بالظبط في الشيت.</div>`;
      return;
    }
    renderVehicleCard(g, resultsEl);
    return;
  }

  // digits only -> show every vehicle whose plate contains this number anywhere
  const found = [];
  vehiclesGroups.forEach((g, key)=>{
    if(key.includes(qRaw)) found.push(g);
  });

  if(found.length === 0){
    resultsEl.innerHTML = `<div class="empty-state">مفيش أي سيارة رقمها فيه <b>${escapeHtml(query)}</b>.</div>`;
    return;
  }

  let list = found;
  if(found.length > 50){
    const note = document.createElement("div");
    note.className = "status-line";
    note.textContent = "فيه نتايج كتير مطابقة، ظاهر أول 50 بس. اكتب رقم أطول عشان تضيّق البحث.";
    resultsEl.appendChild(note);
    list = found.slice(0, 50);
  }

  list.forEach(g => renderVehicleCard(g, resultsEl));
}

/* ======================= Utils ======================= */

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/* ======================= Wiring ======================= */

document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.dataset.tab;
    document.getElementById("page-individuals").style.display = tab==="individuals" ? "block" : "none";
    document.getElementById("page-vehicles").style.display = tab==="vehicles" ? "block" : "none";
  });
});

document.getElementById("ind-btn").addEventListener("click", ()=> searchIndividuals(document.getElementById("ind-input").value));
document.getElementById("ind-input").addEventListener("keydown", e=>{ if(e.key==="Enter") searchIndividuals(e.target.value); });

document.getElementById("veh-btn").addEventListener("click", ()=> searchVehicles(document.getElementById("veh-input").value));
document.getElementById("veh-input").addEventListener("keydown", e=>{ if(e.key==="Enter") searchVehicles(e.target.value); });

initIndividuals();
initVehicles();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").then(reg => reg.update()).catch(()=>{});
  });
}
</script>
