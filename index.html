<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NCM Permission Search</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NCM Permits">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<script src="papaparse.min.js"></script>
<style>

:root{
  /* Brand, taken from the NCM wordmark */
  --blue:#1565C0;
  --blue-deep:#0E4C93;
  --green:#4BA548;
  --grey:#474D54;

  --page:#EDF2F8;
  --card:#FFFFFF;
  --field:#F3F7FB;
  --tint:#E6EEF8;
  --line:#D2DEEC;
  --line-soft:#E2E9F2;
  --edge:#C0D3EC;

  --ink:#0B1114;
  --ink-2:#2A3238;

  --ok:#12874F;      --ok-bg:#DFF3E7;    --ok-br:#8FD3AE;
  --soon:#B96E08;    --soon-bg:#FCEBD5;  --soon-br:#EFC383;
  --bad:#C22F2F;     --bad-bg:#FBE3E3;   --bad-br:#EFA9A9;
  --ban:#A31515;     --ban-bg:#F6D6D6;   --ban-br:#E08A8A;
  --unclear:#5A646C; --unclear-bg:#EDF0F3; --unclear-br:#CBD3DB;

  --topbar-h:66px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  font-family:'IBM Plex Sans Arabic','Tajawal',sans-serif;
  color:var(--ink);
  background:var(--page);
  -webkit-tap-highlight-color:transparent;
}

/* Latin digits, laid out left-to-right even inside Arabic text. */
.num{ direction:ltr; unicode-bidi:embed; display:inline-block; }

.wrap{
  max-width:640px;
  margin:0 auto;
  padding:0 14px calc(40px + env(safe-area-inset-bottom));
}

/* ---- Sticky controls under the tabs: search + language + refresh ---- */
.controls-sticky{
  position:sticky;
  top:0;
  z-index:100;
  background:var(--page);
  padding-top:6px;
}
/* Row 1: tabs on one side, language + refresh on the other */
.tabsrow{
  display:flex;
  align-items:center;
  gap:8px;
  /* Fixed order: language on the left edge, tabs in the middle, refresh on the
     right edge — held with an explicit LTR so it never flips with language. */
  direction:ltr;
}
.tabsrow .tabs{ flex:1; margin:0; align-self:stretch; flex-direction:row-reverse; }

/* Row 2: the search field with a Search button beside it */
.searchrow{
  display:flex;
  align-items:center;
  gap:8px;
  margin:9px 0 4px;
  /* Fixed order so the field and the Search button never swap on language change */
  direction:rtl;
}
.search-go{
  flex-shrink:0;
  height:44px;
  padding:0 20px;
  border:none;
  border-radius:9px;
  background:var(--blue);
  color:#fff;
  font-family:inherit;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}
.search-go:active{ filter:brightness(1.08); }

.search-input-wrap{ position:relative; flex:1; min-width:0; }
.search-icon-btn{
  position:absolute;
  top:50%; inset-inline-start:6px;
  transform:translateY(-50%);
  width:30px; height:30px;
  display:flex; align-items:center; justify-content:center;
  color:var(--blue);
  pointer-events:none;
}
.searchrow input{
  width:100%;
  padding-block:11px;
  padding-inline-start:40px;
  padding-inline-end:36px;
  border-radius:9px;
  border:1px solid var(--line);
  background:var(--field);
  color:var(--ink);
  font-family:inherit;
  font-size:14.5px;
  font-weight:600;
  outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.searchrow input::placeholder{ color:var(--ink-2); font-weight:400; }
.searchrow input:focus{ border-color:var(--blue); box-shadow:0 0 0 3px rgba(21,101,192,0.14); }
.clear-btn{
  position:absolute;
  top:50%; inset-inline-end:8px;
  transform:translateY(-50%);
  width:21px; height:21px;
  display:none; align-items:center; justify-content:center;
  border:none; border-radius:50%;
  background:#DCE4EE; color:var(--ink-2);
  cursor:pointer; padding:0;
}
.clear-btn.show{ display:flex; }

/* Globe + language toggle (single button: shows the language you switch TO) */
.lang-toggle{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:5px;
  height:44px;
  padding:0 13px;
  border:1px solid var(--blue);
  border-radius:9px;
  background:var(--blue);
  color:#fff;
  font-family:inherit;
  font-size:12.5px;
  font-weight:800;
  cursor:pointer;
}
.lang-toggle svg{ width:15px; height:15px; flex-shrink:0; }

/* Refresh-the-data button */
.refresh-btn{
  flex-shrink:0;
  width:44px; height:44px;
  display:flex; align-items:center; justify-content:center;
  border:1px solid #7BC49F;
  border-radius:9px;
  background:#A9D6BC;
  color:#0F6E3F;
  cursor:pointer; padding:0;
}
.refresh-btn:active{ filter:brightness(0.96); }
.refresh-btn.spinning svg{ animation:spin .8s linear infinite; }

/* Lock-screen language toggle, pinned to a corner */
.lock-lang{
  position:absolute;
  top:calc(14px + env(safe-area-inset-top));
  inset-inline-end:16px;
  z-index:2;
}

/* ---- NCM wordmark: N blue, C green, M dark grey ---- */
.logo-mark{ text-align:center; line-height:1; }
.logo-ncm{
  font-family:'Montserrat',sans-serif;
  font-weight:800;
  letter-spacing:-.005em;
  color:var(--blue);
}
.logo-ncm .c{ color:var(--green); }
.logo-ncm .m{ color:var(--grey); }
.logo-sub{
  font-family:'Montserrat',sans-serif;
  font-weight:600;
  color:var(--grey);
  white-space:nowrap;
}
.logo-xl .logo-ncm{ font-size:56px; }
.logo-xl .logo-sub{ font-size:12.2px; letter-spacing:2.9px; margin-top:11px; }
.logo-lg .logo-ncm{ font-size:40px; }
.logo-lg .logo-sub{ font-size:8.6px; letter-spacing:2.05px; margin-top:8px; }
.logo-sm .logo-ncm{ font-size:22px; }
.logo-sm .logo-sub{ font-size:4.8px; letter-spacing:1.1px; margin-top:4px; }

/* ---- Header ---- */
.app-header{
  text-align:center;
  padding:16px;
  margin:0 -14px 0;
  background:var(--card);
  border-bottom:1px solid var(--line);
}
.system-status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:10.5px;
  color:var(--ink-2);
  font-weight:600;
  margin-top:10px;
}
.status-dot{ width:7px; height:7px; border-radius:50%; background:var(--ok); flex-shrink:0; }
.status-dot.updating{ background:var(--soon); animation:statusPulse 1.1s infinite; }
.status-dot.error{ background:var(--bad); }
@keyframes statusPulse{ 0%{opacity:1;} 50%{opacity:.35;} 100%{opacity:1;} }

/* Searching: the logo and connection state step aside entirely. */
body.search-mode .app-header{ display:none; }

/* ---- Tabs ---- */
.tabs{
  display:flex;
  gap:4px;
  background:var(--field);
  border:1px solid var(--line);
  border-radius:11px;
  padding:3px;
  margin:12px 0;
}
body.search-mode .tabs{ margin:10px 0; }
.tab-btn{
  flex:1;
  border:none;
  border-radius:8px;
  padding:9px 10px;
  background:transparent;
  color:var(--ink-2);
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  transition:all .15s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}
.tab-btn.active{ background:#FFD24D; color:#0B1114; }

.status-line{
  text-align:center;
  color:var(--ink-2);
  font-size:12.5px;
  margin-top:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.status-line:empty{ margin-top:0; }
.spinner{
  width:13px; height:13px;
  border-radius:50%;
  border:2px solid var(--edge);
  border-top-color:var(--blue);
  animation:spin .7s linear infinite;
  flex-shrink:0;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

.search-hint, .empty-state{
  text-align:center;
  color:var(--ink-2);
  padding:44px 20px;
  font-size:13.5px;
  line-height:1.8;
}
.search-hint svg, .empty-state svg{
  display:block;
  margin:0 auto 12px;
  color:#93A3B6;
}
.empty-state b{ color:var(--ink); }

.results{ margin-top:12px; display:flex; flex-direction:column; gap:12px; }

/* ---- Record card ---- */
.person-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(21,101,192,0.07);
  animation:recordIn .25s ease;
}
@keyframes recordIn{
  from{ opacity:0; transform:translateY(6px); }
  to{ opacity:1; transform:translateY(0); }
}
.person-head{ padding:13px 15px 0; }
.record-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:11px;
}
.record-identity{ min-width:0; padding-bottom:13px; border-bottom:1px solid var(--line-soft); }
.record-name{
  font-family:'Tajawal',sans-serif;
  font-weight:800;
  font-size:19px;
  color:var(--ink);
  line-height:1.35;
  text-align:center;
  background:var(--tint);
  border:1px solid var(--edge);
  border-radius:11px;
  padding:12px 10px;
  margin-bottom:8px;
}
.record-subid{
  text-align:center;
  font-weight:700;
  font-size:15px;
  letter-spacing:.4px;
  color:var(--ink);
  background:var(--card);
  border:1px solid var(--edge);
  border-radius:11px;
  padding:10px;
}
.count-badge{
  background:var(--field);
  border:1px solid var(--line);
  color:var(--ink-2);
  font-size:10.5px;
  font-weight:700;
  padding:4px 9px;
  border-radius:100px;
  white-space:nowrap;
  flex-shrink:0;
}

.occ-selector{ display:flex; gap:5px; overflow-x:auto; }
.occ-chip{
  flex-shrink:0;
  min-width:30px;
  height:30px;
  padding:0 9px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink-2);
  font-family:inherit;
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
  transition:all .15s ease;
}
.occ-chip.active{ background:var(--blue); border-color:var(--blue); color:#fff; }

.occ-content{ padding:13px 15px 15px; }

.record-rows{
  display:flex;
  flex-direction:column;
  border:1px solid var(--line-soft);
  border-radius:10px;
  overflow:hidden;
}
.record-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:10px 13px;
  border-bottom:1px solid var(--line-soft);
  font-size:13.5px;
}
.record-row:last-child{ border-bottom:none; }
.record-row .k{
  color:var(--ink-2);
  font-weight:600;
  font-size:12px;
  white-space:nowrap;
  flex-shrink:0;
}
.record-row .v{ color:var(--ink); font-weight:700; text-align:end; flex:1; }

/* ---- Permit status banner ---- */
.permit-banner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 14px;
  border-radius:11px;
  border:1.5px solid transparent;
  margin-bottom:12px;
}
.permit-banner .pb-left{ display:flex; align-items:center; gap:9px; }
.permit-icon{
  width:30px; height:30px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  color:#fff;
}
.permit-banner .pb-tag{ font-size:10.5px; font-weight:700; }
.pb-body{ text-align:end; min-width:0; }
.permit-banner .pb-value{ font-size:15.5px; font-weight:800; }
.permit-banner .pb-extra{ font-size:11px; font-weight:600; opacity:.8; margin-top:3px; }

.pb-ok{ background:var(--ok-bg); border-color:var(--ok-br); color:var(--ok); }
.pb-ok .permit-icon{ background:var(--ok); }
.pb-soon{ background:var(--soon-bg); border-color:var(--soon-br); color:var(--soon); }
.pb-soon .permit-icon{ background:var(--soon); }
.pb-bad{ background:var(--bad-bg); border-color:var(--bad-br); color:var(--bad); }
.pb-bad .permit-icon{ background:var(--bad); }
.pb-ban{ background:var(--ban-bg); border-color:var(--ban-br); color:var(--ban); }
.pb-ban .permit-icon{ background:var(--ban); }
.pb-unclear{ background:var(--unclear-bg); border-color:var(--unclear-br); color:var(--unclear); }
.pb-unclear .permit-icon{ background:var(--unclear); }

.occ-date-box{
  text-align:center;
  background:var(--tint);
  border:1px solid var(--line);
  border-radius:11px;
  padding:11px 10px;
  margin-bottom:12px;
}
.occ-date-box .odb-label{ font-weight:700; font-size:13px; color:var(--ink); }
.occ-date-box .odb-value{ font-size:13px; color:var(--ink); font-weight:800; margin-top:4px; }
.occ-date-box .odb-extra{ font-size:11px; color:var(--ink-2); margin-top:3px; }

footer{
  text-align:center;
  color:var(--ink-2);
  font-size:11.5px;
  margin-top:32px;
  opacity:.75;
  line-height:1.8;
}
body.search-mode footer{ display:none; }

/* ======================= Lock Screen ======================= */

#app-root{ display:none; }
body.unlocked #app-root{ display:block; }
body.unlocked #lock-screen{ display:none; }

#lock-screen{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(170deg, #FFFFFF 0%, var(--tint) 100%);
  padding:24px;
}
.lock-card{ width:100%; max-width:340px; text-align:center; }
.lock-logo{ margin-bottom:44px; }

.pin-label{ font-size:13px; color:var(--ink-2); margin-bottom:16px; }
.pin-dots-box{
  padding:18px 0;
  border:1px solid var(--edge);
  border-radius:14px;
  background:var(--card);
  cursor:pointer;
}
.pin-dots-box:focus-within{ border-color:var(--blue); }
.pin-dots{ display:flex; justify-content:center; gap:14px; }
.pin-dot{
  width:14px; height:14px;
  border-radius:50%;
  border:1.5px solid var(--edge);
  background:transparent;
  transition:background .15s ease, transform .15s ease, border-color .15s ease;
}
.pin-dot.filled{ background:var(--blue); border-color:var(--blue); transform:scale(1.1); }
.pin-dots.shake{ animation:pinShake .4s ease; }
.pin-dots.shake .pin-dot{ border-color:var(--bad); }
@keyframes pinShake{
  10%,90% { transform:translateX(-1px); }
  20%,80% { transform:translateX(2px); }
  30%,50%,70% { transform:translateX(-5px); }
  40%,60% { transform:translateX(5px); }
}
.pin-tap-hint{ font-size:11px; color:#6B7885; margin-top:12px; transition:opacity .15s ease; }
.pin-error{
  height:16px;
  font-size:12.5px;
  color:var(--bad);
  margin-top:8px;
  opacity:0;
  transition:opacity .15s ease;
}
.pin-error.show{ opacity:1; }
.pin-hidden-input{ position:absolute; opacity:0; width:1px; height:1px; border:none; padding:0; }

@media (max-width:380px){
  .logo-xl .logo-ncm{ font-size:46px; }
  .logo-xl .logo-sub{ font-size:10px; letter-spacing:2.4px; }
}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-lang">
    <button type="button" class="lang-toggle" aria-label="Language"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></svg><span class="lang-toggle-label">EN</span></button>
  </div>
  <div class="lock-card">
    <div class="lock-logo">
      <div class="logo-mark logo-xl">
        <div class="logo-ncm">N<span class="c">C</span><span class="m">M</span></div>
        <div class="logo-sub">NUCLEAR CONCRETE MIXES</div>
      </div>
    </div>

    <div class="pin-label" data-i18n="pinLabel">أدخل رمز الدخول</div>
    <div class="pin-dots-box" id="pin-dots-box">
      <div class="pin-dots" id="pin-dots">
        <span class="pin-dot"></span><span class="pin-dot"></span>
        <span class="pin-dot"></span><span class="pin-dot"></span>
      </div>
    </div>
    <div class="pin-tap-hint" id="pin-tap-hint" data-i18n="pinHint">اضغط هنا لفتح لوحة المفاتيح</div>
    <div class="pin-error" id="pin-error" data-i18n="pinError">رمز الدخول غير صحيح</div>

    <input id="pin-hidden-input" type="tel" inputmode="numeric" autocomplete="off" maxlength="4" class="pin-hidden-input" aria-label="PIN">
  </div>
</div>


<div id="app-root">
<div class="wrap">

  <div class="app-header">
    <div class="logo-mark logo-lg">
      <div class="logo-ncm">N<span class="c">C</span><span class="m">M</span></div>
      <div class="logo-sub">NUCLEAR CONCRETE MIXES</div>
    </div>
    <div class="system-status">
      <span class="status-dot updating" id="system-status-dot"></span>
      <span id="system-status-label" data-i18n="statusUpdating">جاري التحديث</span>
    </div>
  </div>

  <div class="controls-sticky">
    <div class="tabsrow">
      <button type="button" class="lang-toggle" aria-label="Language"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></svg><span class="lang-toggle-label">EN</span></button>
      <div class="tabs">
        <button class="tab-btn active" data-tab="individuals">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
          <span data-i18n="tabIndividuals">الأفراد</span>
        </button>
        <button class="tab-btn" data-tab="vehicles">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 13l1.5-5A2 2 0 0 1 6.4 6.5h11.2a2 2 0 0 1 1.9 1.5L21 13"/><rect x="3" y="13" width="18" height="5" rx="1"/><circle cx="7" cy="18.5" r="1.4"/><circle cx="17" cy="18.5" r="1.4"/></svg>
          <span data-i18n="tabVehicles">المركبات</span>
        </button>
      </div>
      <button type="button" class="refresh-btn" id="refresh-btn" aria-label="Refresh" title="تحديث البيانات">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
    <div class="searchrow">
      <div class="search-input-wrap">
        <span class="search-icon-btn" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </span>
        <input id="main-input" type="text" dir="auto" autocomplete="off" data-i18n-placeholder="searchPlaceholderInd" placeholder="الرقم القومى أو الاسم">
        <button type="button" class="clear-btn" id="main-clear" aria-label="Clear">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <button type="button" class="search-go" id="main-search-btn" data-i18n="searchBtn">بحث</button>
    </div>
  </div>

  <section id="page-individuals">
    <div class="status-line" id="ind-status"><span class="spinner"></span><span data-i18n="loadingData">جاري تحميل البيانات</span></div>
    <div class="search-hint" id="ind-hint">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>

<script>
/* ======================= Lock Screen (UI access lock, client-side only) ======================= */
(function(){
  const CORRECT_PIN = "1804";
  // Bump ACCESS_VERSION to revoke every device that was already unlocked.
  const ACCESS_VERSION = "2";
  const UNLOCK_FLAG_KEY = "ncm_device_unlocked";
  let entered = "";

  if(localStorage.getItem(UNLOCK_FLAG_KEY) === ACCESS_VERSION){
    document.body.classList.add("unlocked");
    return;
  }
  try{ localStorage.removeItem(UNLOCK_FLAG_KEY); }catch(e){}

  const dotsWrap = document.getElementById("pin-dots");
  const dots = dotsWrap.querySelectorAll(".pin-dot");
  const errorEl = document.getElementById("pin-error");
  const hiddenInput = document.getElementById("pin-hidden-input");
  const dotsBox = document.getElementById("pin-dots-box");
  const tapHint = document.getElementById("pin-tap-hint");

  function renderDots(){ dots.forEach((d,i)=> d.classList.toggle("filled", i < entered.length)); }
  function clearError(){ errorEl.classList.remove("show"); dotsWrap.classList.remove("shake"); }
  function showError(){
    errorEl.classList.add("show");
    dotsWrap.classList.add("shake");
    if(navigator.vibrate) navigator.vibrate(120);
    setTimeout(()=>{
      entered = ""; hiddenInput.value = "";
      renderDots(); dotsWrap.classList.remove("shake");
    }, 420);
  }
  function unlock(){
    try{ localStorage.setItem(UNLOCK_FLAG_KEY, ACCESS_VERSION); }catch(e){}
    hiddenInput.blur();
    document.body.classList.add("unlocked");
  }
  function checkIfComplete(){
    if(entered.length === 4){
      if(entered === CORRECT_PIN){ clearError(); unlock(); }
      else showError();
    }
  }

  hiddenInput.addEventListener("input", ()=>{
    entered = hiddenInput.value.replace(/[^0-9]/g,"").slice(0,4);
    hiddenInput.value = entered;
    clearError(); renderDots(); checkIfComplete();
  });
  hiddenInput.addEventListener("keydown", (e)=>{
    if(e.key === "Enter"){ e.preventDefault(); checkIfComplete(); }
  });

  function focusInput(){ hiddenInput.focus(); }
  dotsBox.addEventListener("click", focusInput);
  tapHint.addEventListener("click", focusInput);
  document.querySelector(".lock-card").addEventListener("click", focusInput);
  hiddenInput.addEventListener("focus", ()=>{ tapHint.style.opacity = "0"; });
  hiddenInput.addEventListener("blur", ()=>{ tapHint.style.opacity = "1"; });
  focusInput();
})();
</script>

<script>
/* ======================= CONFIG ======================= */
const SHEET_ID = "18EH8aogUF0qZeLFjku7uiF3e9a_TjCTojRd53qMx0a0";
// Read tabs by NAME, not gid. Importing or replacing a tab changes its gid,
// and the old gid then silently falls back to the first sheet (individuals) —
// which is exactly what broke vehicle search. Tab names survive a re-import.
// (The trailing space in the individuals tab name is part of the real name.)
const GVIZ_BASE = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv&sheet=";
const INDIVIDUALS_CSV_URL = GVIZ_BASE + encodeURIComponent("تصاريح أفراد ");
const VEHICLES_CSV_URL    = GVIZ_BASE + encodeURIComponent("تصاريح مركبات");

/* ======================= Helpers ======================= */

/* Every number in the app shows as 0-9. Arabic letters are untouched — this
   only rewrites Arabic-Indic and Persian digit characters. */
function toLatinDigits(s){
  return String(s)
    .replace(/[٠-٩]/g, d => String.fromCharCode(d.charCodeAt(0) - 0x0660 + 48))
    .replace(/[۰-۹]/g, d => String.fromCharCode(d.charCodeAt(0) - 0x06F0 + 48));
}

function normalize(s){
  if(s===null || s===undefined) return "";
  return toLatinDigits(String(s)).replace(/\s+/g," ").trim();
}

function digitsOnly(s){ return normalize(s).replace(/[^\d]/g,""); }

const BAN_WORDS = ["منع"];
const RENEW_WORDS = ["عايز تجديد","الرخصه منتهيه","غيرت لوحات","تجديد"];
const TEMP_WORDS = ["مؤقت"];
const QUESTION_MARKS_ONLY = /^[؟?]+$/;
const LEADING_DATE = /^(\d{1,2})([-\/])(\d{1,2})[-\/](\d{4})/;

/* The sheet hands us two different date shapes:
     "18-11-2025"  text cells typed by hand      -> day first
     "11/30/2025"  real date cells, which gviz exports in US order -> month first
   Reading a slash date as day-first turns 11/30/2025 into month 30, which JS
   rolls forward into 2028 and paints an expired permit green. */
function parseDateParts(s){
  const m = normalize(s).match(LEADING_DATE);
  if(!m) return null;

  const a = parseInt(m[1],10);
  const sep = m[2];
  const b = parseInt(m[3],10);
  const year = parseInt(m[4],10);

  let day, month;
  // The sheet is normalised to day-first (dd/mm/yyyy). Only read month-first
  // when day-first is impossible, which is what a legacy US-order export looks
  // like. `sep` is kept for that older shape.
  if(b > 12 && a <= 12){ month = a; day = b; }
  else { day = a; month = b; }

  if(month < 1 || month > 12 || day < 1 || day > 31) return null;
  const d = new Date(year, month-1, day);
  if(isNaN(d.getTime()) || d.getMonth() !== month-1 || d.getDate() !== day) return null;

  return { date:d, day, month, year, matched:m[0] };
}

function parseDateLoose(v){
  const p = v ? parseDateParts(v) : null;
  return p ? p.date : null;
}

const pad2 = n => String(n).padStart(2,"0");

/* Splits a cell into a tidy dd/mm/yyyy date plus whatever text trailed it,
   so "18-11-2025(ABNA SINA)" shows the date on one line and the note below. */
function splitDateAndNote(v){
  const s = normalize(v);
  if(!s) return { date:null, note:"" };
  const p = parseDateParts(s);
  if(!p) return { date:null, note:s };
  const rest = s.slice(p.matched.length).replace(/^[\s\-\/(),.:؛;]+/,"").replace(/[)\]]+$/,"").trim();
  return { date:`${pad2(p.day)}/${pad2(p.month)}/${p.year}`, note:rest };
}

function classifyPermit(rawValue){
  const s = normalize(rawValue);
  if(s === "") return {kind:"pending", cls:"pb-soon", raw:s};

  const noSpaces = s.replace(/\s+/g,"");
  if(QUESTION_MARKS_ONLY.test(noSpaces)) return {kind:"undetermined", cls:"pb-unclear", raw:s};

  if(BAN_WORDS.some(w=>s.includes(w))) return {kind:"raw", cls:"pb-ban", raw:s};
  if(RENEW_WORDS.some(w=>s.includes(w))) return {kind:"raw", cls:"pb-bad", raw:s};
  if(TEMP_WORDS.some(w=>s.includes(w))) return {kind:"raw", cls:"pb-unclear", raw:s};

  const d = parseDateLoose(s);
  if(d){
    const today = new Date();
    today.setHours(0,0,0,0);
    const diffDays = Math.round((d - today) / 86400000);
    if(diffDays < 0) return {kind:"raw", cls:"pb-bad", raw:s};
    if(diffDays <= 30) return {kind:"raw", cls:"pb-soon", raw:s};
    return {kind:"raw", cls:"pb-ok", raw:s};
  }
  return {kind:"raw", cls:"pb-unclear", raw:s};
}

function permitDisplay(p){
  if(p.kind === "pending") return { main:t("permitPending"), note:"" };
  if(p.kind === "undetermined") return { main:t("permitUndetermined"), note:"" };

  const parts = splitDateAndNote(p.raw);
  if(parts.date) return { main:parts.date, note:parts.note };

  if(LANG === "en"){
    for(const [ar, en] of PERMIT_PHRASE_EN){
      if(p.raw.includes(ar)) return { main:en, note:"" };
    }
  }
  return { main:p.raw, note:"" };
}

function loadCSVRaw(url){
  // Cache-buster so a manual refresh (and every load) sees the newest sheet.
  const busted = url + (url.indexOf("?") === -1 ? "?" : "&") + "_=" + Date.now();
  return new Promise((resolve, reject)=>{
    Papa.parse(busted, {
      download:true, header:false, skipEmptyLines:false,
      complete: (res)=> resolve(res.data),
      error: (err)=> reject(err)
    });
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/** Escape for display, with Arabic-Indic digits rewritten to 0-9. */
function disp(str){ return escapeHtml(toLatinDigits(String(str))); }

/** Wrap a value that is mostly digits so it always reads left-to-right. */
function dispNum(str){ return `<span class="num">${disp(str)}</span>`; }

/* ======================= Individuals ======================= */

let individualsGroups = null;

// Fixed column order in "تصاريح أفراد": م, م, الاسم, الوظيفة, الرقم القومى, العنوان, ملاحظات, المرسل, تصريح, Mali Day
const IND_COL = { NAME:2, JOB:3, ID:4, ADDR:5, NOTE:6, SENDER:7, PERMIT:8, DAY:9 };

async function initIndividuals(){
  const statusEl = document.getElementById("ind-status");
  try{
    const rows = await loadCSVRaw(INDIVIDUALS_CSV_URL);
    const dataRows = rows.slice(1);

    individualsGroups = new Map();

    dataRows.forEach(cols=>{
      if(!cols || cols.length < 5) return;
      const idVal = normalize(cols[IND_COL.ID]);
      const nameVal = normalize(cols[IND_COL.NAME]);
      if(!idVal && !nameVal) return;

      const key = idVal ? ("ID:"+digitsOnly(idVal)) : ("NAME:"+nameVal);
      if(!individualsGroups.has(key)){
        individualsGroups.set(key, { name:nameVal, nationalId:idVal, records:[] });
      }
      individualsGroups.get(key).records.push({
        job: normalize(cols[IND_COL.JOB]),
        address: normalize(cols[IND_COL.ADDR]),
        note: normalize(cols[IND_COL.NOTE]),
        sender: normalize(cols[IND_COL.SENDER]),
        permit: cols[IND_COL.PERMIT],
        day: cols[IND_COL.DAY],
        dayParsed: parseDateLoose(cols[IND_COL.DAY])
      });
    });

    window.__individualsByName = new Map();
    individualsGroups.forEach((g)=>{
      const nameKey = normalize(g.name);
      if(!nameKey) return;
      if(!window.__individualsByName.has(nameKey)) window.__individualsByName.set(nameKey, []);
      window.__individualsByName.get(nameKey).push(g);
    });

    statusEl.textContent = "";
    return true;
  }catch(err){
    const detail = (err && (err.message || err.toString())) || "unknown";
    statusEl.dataset.errDetail = detail;
    statusEl.textContent = t("loadErrInd", detail);
    console.error(err);
    return false;
  }
}

const PERMIT_ICONS = {
  "pb-ok": '<path d="M20 6L9 17l-5-5"/>',
  "pb-soon": '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  "pb-bad": '<circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><circle cx="12" cy="16" r="0.5" fill="currentColor"/>',
  "pb-ban": '<circle cx="12" cy="12" r="9"/><path d="M5.5 5.5l13 13"/>',
  "pb-unclear": '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.7v.3"/><circle cx="12" cy="16.5" r="0.5" fill="currentColor"/>'
};

function attachOccurrenceSwitcher(card, chipsContainer, sorted, fieldsHtmlFn){
  const content = document.createElement("div");
  content.className = "occ-content";

  function renderContent(idx){
    const rec = sorted[idx];
    const p = classifyPermit(rec.permit);
    const icon = PERMIT_ICONS[p.cls] || PERMIT_ICONS["pb-unclear"];
    const shown = permitDisplay(p);
    const sent = splitDateAndNote(rec.day);

    const permitMain = shown.main && /^\d/.test(shown.main) ? dispNum(shown.main) : disp(shown.main);
    const sentMain = sent.date ? dispNum(sent.date) : disp(sent.note || t("notSpecified"));
    const sentNote = sent.date ? sent.note : "";

    content.innerHTML = `
      <div class="permit-banner ${p.cls}">
        <div class="pb-left">
          <div class="permit-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">${icon}</svg></div>
          <span class="pb-tag">${disp(t("permitTag"))}</span>
        </div>
        <div class="pb-body">
          <div class="pb-value">${permitMain}</div>
          ${shown.note ? `<div class="pb-extra">${disp(shown.note)}</div>` : ""}
        </div>
      </div>
      <div class="occ-date-box">
        <div class="odb-label">${disp(t("sendDate"))}</div>
        <div class="odb-value">${sentMain}</div>
        ${sentNote ? `<div class="odb-extra">${disp(sentNote)}</div>` : ""}
      </div>
      <div class="record-rows">${fieldsHtmlFn(rec)}</div>
    `;
  }

  const defaultIdx = sorted.length - 1;

  sorted.forEach((rec, i)=>{
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "occ-chip" + (i === defaultIdx ? " active" : "");
    chip.textContent = i + 1;
    chip.addEventListener("click", ()=>{
      chipsContainer.querySelectorAll(".occ-chip").forEach(c=>c.classList.remove("active"));
      chip.classList.add("active");
      renderContent(i);
    });
    chipsContainer.appendChild(chip);
  });

  renderContent(defaultIdx);
  card.appendChild(content);
}

function sortByDay(records){
  return [...records].sort((a,b)=>{
    if(a.dayParsed && b.dayParsed) return a.dayParsed - b.dayParsed;
    if(a.dayParsed) return -1;
    if(b.dayParsed) return 1;
    return 0;
  });
}

function searchIndividuals(query){
  const q = normalize(query);
  const resultsEl = document.getElementById("ind-results");
  const hintEl = document.getElementById("ind-hint");
  resultsEl.innerHTML = "";
  if(!q){ hintEl.style.display = ""; return; }
  hintEl.style.display = "none";

  if(!individualsGroups){
    resultsEl.innerHTML = `<div class="empty-state">${disp(t("stillLoading"))}</div>`;
    return;
  }

  let matches = [];
  let truncated = false;
  const qDigits = digitsOnly(q);
  if(qDigits.length >= 8){
    const byId = individualsGroups.get("ID:"+qDigits);
    if(byId) matches.push(byId);
  }
  if(matches.length === 0){
    if(window.__individualsByName.has(q)){
      matches = window.__individualsByName.get(q);
    }else{
      const found = [];
      individualsGroups.forEach(g=>{
        if(g.name && normalize(g.name).includes(q)) found.push(g);
      });
      if(found.length > 50){ truncated = true; matches = found.slice(0, 50); }
      else matches = found;
    }
  }

  if(matches.length === 0){
    resultsEl.innerHTML = `
      <div class="empty-state">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        ${t("noResultInd", disp(q))}
      </div>`;
    return;
  }

  if(truncated){
    const note = document.createElement("div");
    note.className = "status-line";
    note.textContent = t("truncatedName");
    resultsEl.appendChild(note);
  }

  matches.forEach(g=>{
    const sorted = sortByDay(g.records);
    const card = document.createElement("div");
    card.className = "person-card";

    const head = document.createElement("div");
    head.className = "person-head";
    head.innerHTML = `
      <div class="record-top">
        <div class="occ-selector"></div>
        <div class="count-badge">${disp(t("permitCount", sorted.length))}</div>
      </div>
      <div class="record-identity">
        <div class="record-name">${disp(g.name || t("noName"))}</div>
        <div class="record-subid">${g.nationalId ? dispNum(g.nationalId) : disp(t("noId"))}</div>
      </div>
    `;
    card.appendChild(head);

    attachOccurrenceSwitcher(card, head.querySelector(".occ-selector"), sorted, rec => `
      <div class="record-row"><span class="k">${disp(t("fieldJob"))}</span><span class="v">${disp(rec.job || "—")}</span></div>
      <div class="record-row"><span class="k">${disp(t("fieldAddress"))}</span><span class="v">${disp(rec.address || "—")}</span></div>
      <div class="record-row"><span class="k">${disp(t("fieldSender"))}</span><span class="v">${disp(rec.sender || "—")}</span></div>
      <div class="record-row"><span class="k">${disp(t("fieldNotes"))}</span><span class="v">${disp(rec.note || "—")}</span></div>
    `);

    resultsEl.appendChild(card);
  });
}

/* ======================= Vehicles ======================= */

let vehiclesGroups = null;

// Fixed column order in "تصاريح مركبات": م, م, رقم السيارة, النوع, تابعه, تصريح, Mail Day
const VEH_COL = { PLATE:2, TYPE:3, OWNER:4, PERMIT:5, DAY:6 };

async function initVehicles(){
  const statusEl = document.getElementById("veh-status");
  try{
    const rows = await loadCSVRaw(VEHICLES_CSV_URL);
    const dataRows = rows.slice(1);

    vehiclesGroups = new Map();

    dataRows.forEach(cols=>{
      if(!cols || cols.length < 3) return;
      const plateVal = normalize(cols[VEH_COL.PLATE]);
      if(!plateVal) return;
      const key = plateVal.replace(/\s+/g,"");
      if(!vehiclesGroups.has(key)){
        vehiclesGroups.set(key, {plate:plateVal, records:[]});
      }
      vehiclesGroups.get(key).records.push({
        type: normalize(cols[VEH_COL.TYPE]),
        owner: normalize(cols[VEH_COL.OWNER]),
        permit: cols[VEH_COL.PERMIT],
        day: cols[VEH_COL.DAY],
        dayParsed: parseDateLoose(cols[VEH_COL.DAY])
      });
    });

    statusEl.textContent = "";
    return true;
  }catch(err){
    const detail = (err && (err.message || err.toString())) || "unknown";
    statusEl.dataset.errDetail = detail;
    statusEl.textContent = t("loadErrVeh", detail);
    console.error(err);
    return false;
  }
}

function renderVehicleCard(g, resultsEl){
  const sorted = sortByDay(g.records);

  const card = document.createElement("div");
  card.className = "person-card";
  const head = document.createElement("div");
  head.className = "person-head";
  head.innerHTML = `
    <div class="record-top">
      <div class="occ-selector"></div>
      <div class="count-badge">${disp(t("permitCount", sorted.length))}</div>
    </div>
    <div class="record-identity">
      <div class="record-name" style="margin-bottom:0;">${disp(g.plate)}</div>
    </div>
  `;
  card.appendChild(head);

  attachOccurrenceSwitcher(card, head.querySelector(".occ-selector"), sorted, rec => `
    <div class="record-row"><span class="k">${disp(t("fieldType"))}</span><span class="v">${disp(rec.type || "—")}</span></div>
    <div class="record-row"><span class="k">${disp(t("fieldOwner"))}</span><span class="v">${disp(rec.owner || "—")}</span></div>
  `);

  resultsEl.appendChild(card);
}

function searchVehicles(query){
  const qRaw = normalize(query).replace(/\s+/g,"");
  const resultsEl = document.getElementById("veh-results");
  const hintEl = document.getElementById("veh-hint");
  resultsEl.innerHTML = "";
  if(!qRaw){ hintEl.style.display = ""; return; }
  hintEl.style.display = "none";

  if(!vehiclesGroups){
    resultsEl.innerHTML = `<div class="empty-state">${disp(t("stillLoading"))}</div>`;
    return;
  }

  const isDigitsOnly = /^[0-9]+$/.test(qRaw);

  if(!isDigitsOnly){
    const g = vehiclesGroups.get(qRaw);
    if(!g){
      resultsEl.innerHTML = `
        <div class="empty-state">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          ${t("noResultVeh", disp(normalize(query)))}
        </div>`;
      return;
    }
    renderVehicleCard(g, resultsEl);
    return;
  }

  const found = [];
  vehiclesGroups.forEach((g, key)=>{ if(key.includes(qRaw)) found.push(g); });

  if(found.length === 0){
    resultsEl.innerHTML = `
      <div class="empty-state">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        ${t("noPlateContains", disp(normalize(query)))}
      </div>`;
    return;
  }

  let list = found;
  if(found.length > 50){
    const note = document.createElement("div");
    note.className = "status-line";
    note.textContent = t("truncatedPlate");
    resultsEl.appendChild(note);
    list = found.slice(0, 50);
  }

  list.forEach(g => renderVehicleCard(g, resultsEl));
}

/* ======================= Search wiring (one field, two tabs) ======================= */

const mainInput = document.getElementById("main-input");
const mainClear = document.getElementById("main-clear");

let activeTab = "individuals";
const drafts = { individuals:"", vehicles:"" };
const submitted = { individuals:"", vehicles:"" };

function syncPlaceholder(){
  mainInput.placeholder = t(activeTab === "individuals" ? "searchPlaceholderInd" : "searchPlaceholderVeh");
}
function syncClear(){ mainClear.classList.toggle("show", mainInput.value.length > 0); }
function updateSearchMode(){
  document.body.classList.toggle("search-mode", !!normalize(submitted[activeTab]));
}

function runSearch(){
  const value = mainInput.value;
  drafts[activeTab] = value;
  submitted[activeTab] = value;
  if(activeTab === "individuals") searchIndividuals(value);
  else searchVehicles(value);
  updateSearchMode();
}

function switchTab(tab){
  drafts[activeTab] = mainInput.value;
  activeTab = tab;
  mainInput.value = drafts[tab];
  syncPlaceholder();
  syncClear();
  document.getElementById("page-individuals").style.display = tab === "individuals" ? "block" : "none";
  document.getElementById("page-vehicles").style.display = tab === "vehicles" ? "block" : "none";
  updateSearchMode();
}

document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    switchTab(btn.dataset.tab);
  });
});

document.getElementById("main-search-btn").addEventListener("click", ()=>{
  mainInput.blur();
  runSearch();
});
mainInput.addEventListener("keydown", e=>{
  if(e.key === "Enter"){ e.preventDefault(); mainInput.blur(); runSearch(); }
});
mainInput.addEventListener("input", syncClear);
mainClear.addEventListener("click", ()=>{
  mainInput.value = "";
  syncClear();
  runSearch();
  mainInput.focus();
});
syncPlaceholder();
syncClear();

/* ======================= Status + language refresh ======================= */

let lastSystemState = "updating";

function setSystemStatus(state){
  lastSystemState = state;
  const dot = document.getElementById("system-status-dot");
  const label = document.getElementById("system-status-label");
  dot.classList.remove("updating","error");
  if(state === "error"){ dot.classList.add("error"); label.textContent = t("statusError"); }
  else if(state === "updating"){ dot.classList.add("updating"); label.textContent = t("statusUpdating"); }
  else label.textContent = t("statusOnline");
}

function refreshDynamicUI(){
  setSystemStatus(lastSystemState);
  [["ind-status","loadErrInd"],["veh-status","loadErrVeh"]].forEach(([id, key])=>{
    const el = document.getElementById(id);
    if(el && el.dataset.errDetail) el.textContent = t(key, el.dataset.errDetail);
  });
  if(submitted.individuals) searchIndividuals(submitted.individuals);
  if(submitted.vehicles) searchVehicles(submitted.vehicles);
  updateSearchMode();
}

Promise.all([initIndividuals(), initVehicles()]).then(results=>{
  setSystemStatus(results.some(r => r === false) ? "error" : "online");
});

/* ---- Refresh: re-fetch both tabs from the sheet on demand ---- */
let dataReloading = false;
async function reloadData(){
  if(dataReloading) return;
  dataReloading = true;
  const btn = document.getElementById("refresh-btn");
  if(btn) btn.classList.add("spinning");
  individualsGroups = null;
  vehiclesGroups = null;
  window.__individualsByName = new Map();
  setSystemStatus("updating");
  try{
    const results = await Promise.all([initIndividuals(), initVehicles()]);
    setSystemStatus(results.some(r => r === false) ? "error" : "online");
  }catch(e){
    setSystemStatus("error");
  }finally{
    if(btn) btn.classList.remove("spinning");
    dataReloading = false;
  }
  if(submitted.individuals) searchIndividuals(submitted.individuals);
  if(submitted.vehicles) searchVehicles(submitted.vehicles);
}

const _refreshBtn = document.getElementById("refresh-btn");
if(_refreshBtn) _refreshBtn.addEventListener("click", reloadData);

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").then(reg => reg.update()).catch(()=>{});
  });
}
</script>
